    }

    function lbCreateSeason(modeId, seasonNum = 1) {
      const preset = LB_PRESETS[modeId];
      const now = Date.now() + lbSimOffsetMs;
      const seed = seasonNum * 101 + modeId.length * 37;
      const bots = [];

      for (let i = 0; i < preset.botCount; i++) {
        const ratio = i / Math.max(1, preset.botCount - 1);
        const archetype = ratio < 0.15 ? 'elite' : (ratio < 0.45 ? 'rival' : (ratio < 0.75 ? 'steady' : 'casual'));
        const jitter = ((seed * (i + 17) * 7919) % 100) / 100;
        const span = preset.baseBotTargetMax - preset.baseBotTargetMin;

        if (preset.scoringRule === 'cumulative') {
          const targetEndScore = Math.round(preset.baseBotTargetMax - ratio * span + (jitter - 0.5) * 180);
          const initialScore = Math.round(targetEndScore * (0.04 + jitter * 0.08));
          bots.push({
            botId: `bot_${i + 1}`,
            name: LB_BOT_NAMES[i % LB_BOT_NAMES.length],
            avatar: LB_BOT_AVATARS[i % LB_BOT_AVATARS.length],
            archetype,
            score: Math.max(20, initialScore),
            targetEndScore: Math.max(250, targetEndScore)
          });
        } else {
          const targetBestMs = Math.round(preset.baseBotTargetMin + Math.pow(ratio, 1.15) * span + (jitter - 0.5) * 4000);
          const initialMs = Math.round(targetBestMs * (1.15 + jitter * 0.15));
          bots.push({
            botId: `bot_${i + 1}`,
            name: LB_BOT_NAMES[i % LB_BOT_NAMES.length],
            avatar: LB_BOT_AVATARS[i % LB_BOT_AVATARS.length],
            archetype,
            score: initialMs,
            targetEndScore: Math.max(preset.baseBotTargetMin, targetBestMs)
          });
        }
      }

      const st = {
        schemaVersion: 1,
        seasonNumber: seasonNum,
        seasonId: `S0${seasonNum}_${modeId.toUpperCase()}`,
        gameMode: modeId,
        scoringRule: preset.scoringRule,
        startTimeMs: now,
        endTimeMs: now + preset.seasonDurationMs,
        lastSimulatedAtMs: now,
        lastSeenTimestampMs: now,
        status: 'active',
        rewardClaimed: false,
        playerIdentity: { id: 'local_player_01', displayName: 'You (Player)', avatar: '🧩' },
        playerEntry: { score: 0, runsCompleted: 0, previousRank: 30, currentRank: 30 },
        bots,
        checksum: ''
      };
      lbSaveState(modeId, st);
      return st;
    }

    function lbLoadState(modeId) {
      try {
        const raw = localStorage.getItem(LB_STORAGE_PREFIX + modeId);
        if (!raw) return lbCreateSeason(modeId, 1);
        const parsed = JSON.parse(raw);
        if (!parsed || parsed.schemaVersion !== 1 || parsed.checksum !== lbComputeChecksum(parsed)) {
          return lbCreateSeason(modeId, 1);
        }
        return parsed;
      } catch (e) {
        return lbCreateSeason(modeId, 1);
      }
    }

    function lbSaveState(modeId, st) {
      st.checksum = lbComputeChecksum(st);
      localStorage.setItem(LB_STORAGE_PREFIX + modeId, JSON.stringify(st));
    }

    function lbAdvanceBotsAndSync(modeId) {
      const preset = LB_PRESETS[modeId];
      const st = lbLoadState(modeId);
      const rawNow = Date.now() + lbSimOffsetMs;
      const clamped = rawNow < st.lastSeenTimestampMs;
      const effectiveNow = Math.max(rawNow, st.lastSeenTimestampMs);
      st.lastSeenTimestampMs = effectiveNow;

      const simTarget = Math.min(effectiveNow, st.endTimeMs);
      const dtMs = Math.max(0, simTarget - st.lastSimulatedAtMs);

      if (dtMs > 0) {
        const totalDur = Math.max(1, st.endTimeMs - st.startTimeMs);
        const prevProg = Math.min(1, Math.max(0, (st.lastSimulatedAtMs - st.startTimeMs) / totalDur));
        const newProg = Math.min(1, Math.max(0, (simTarget - st.startTimeMs) / totalDur));
        const deltaProg = Math.max(0, newProg - prevProg);

        if (deltaProg > 0) {
          const isLate = newProg >= 0.65;
          const pScore = st.playerEntry.score;

          st.bots.forEach((bot, idx) => {
            if (isLate && pScore > 0 && (bot.archetype === 'rival' || bot.archetype === 'elite')) {
              if (preset.scoringRule === 'cumulative') {
                const proj = pScore / Math.max(0.35, newProg);
                const diff = proj - bot.targetEndScore;
                if (Math.abs(diff) < 1200) bot.targetEndScore = Math.round(bot.targetEndScore + diff * 0.18);
              } else {
                const diff = pScore - bot.targetEndScore;
                if (Math.abs(diff) < 25000) bot.targetEndScore = Math.round(bot.targetEndScore + diff * 0.15);
              }
            }
            const remProg = Math.max(0.01, 1 - prevProg);
            const stepFrac = Math.min(1, deltaProg / remProg);
            const variance = 0.85 + (((idx * 31 + Math.floor(newProg * 100)) % 30) / 100);

            if (preset.scoringRule === 'cumulative') {
              const remPts = Math.max(0, bot.targetEndScore - bot.score);
              bot.score += Math.round(remPts * stepFrac * variance);
            } else {
              const remRoom = Math.max(0, bot.score - bot.targetEndScore);
              bot.score = Math.max(bot.targetEndScore, bot.score - Math.round(remRoom * stepFrac * variance * 0.75));
            }
          });
        }
        st.lastSimulatedAtMs = simTarget;
      }

      if (effectiveNow >= st.endTimeMs && st.status === 'active') {
        st.status = 'expired_unclaimed';
      }

      const calc = lbCalculateRanks(st, preset);
      st.playerEntry.currentRank = calc.playerRank;
      lbSaveState(modeId, st);
      return { st, calc, clamped, effectiveNow };
    }

    function lbCalculateRanks(st, preset) {
      const entries = st.bots.map(b => ({
        id: b.botId,
        name: b.name,
        avatar: b.avatar,
        archetype: b.archetype,
        score: b.score,
        isPlayer: false
      }));
      entries.push({
        id: 'player_local',
        name: st.playerIdentity.displayName,
        avatar: st.playerIdentity.avatar,
        archetype: 'YOU',
        score: st.playerEntry.score,
        isPlayer: true
      });

      entries.sort((a, b) => {
        if (preset.scoringRule === 'cumulative') {
          if (b.score !== a.score) return b.score - a.score;
          return a.isPlayer ? -1 : 1;
        } else {
          const aVal = a.score > 0 ? a.score : Number.MAX_SAFE_INTEGER;
          const bVal = b.score > 0 ? b.score : Number.MAX_SAFE_INTEGER;
          if (aVal !== bVal) return aVal - bVal;
          return a.isPlayer ? -1 : 1;
        }
      });

      let playerRank = entries.length;
      entries.forEach((e, idx) => {
        e.rank = idx + 1;
        if (e.isPlayer) playerRank = e.rank;
      });

      const selected = new Set([0, 1, 2]);
      const pIdx = playerRank - 1;
      for (let i = Math.max(0, pIdx - 2); i <= Math.min(entries.length - 1, pIdx + 2); i++) {
        selected.add(i);
      }
      let padIdx = 3;
      while (selected.size < 8 && padIdx < entries.length) selected.add(padIdx++);

      const sortedIdx = Array.from(selected).sort((a, b) => a - b);
      const windowedRows = [];
      let prev = -1;
      sortedIdx.forEach(idx => {
        if (prev !== -1 && idx - prev > 1) {
          windowedRows.push({ isDivider: true, skippedCount: idx - prev - 1 });
        }
        windowedRows.push(entries[idx]);
        prev = idx;
      });

      const rewardTier = playerRank === 1
        ? { name: 'Gold Crown', coins: 500, badge: '🥇' }
        : (playerRank <= 3 ? { name: 'Silver Chest', coins: 250, badge: '🥈' }
        : (playerRank <= 10 ? { name: 'Bronze Pack', coins: 100, badge: '🥉' } : { name: 'Participation', coins: 25, badge: '🎖️' }));

      return { totalEntries: entries.length, playerRank, windowedRows, rewardTier };
    }

    function lbFormatScore(score, preset) {
      if (preset.scoringRule === 'cumulative') return `${score.toLocaleString()} pts`;
      if (!score || score <= 0) return 'Unranked';
      return `${(score / 1000).toFixed(2)}s`;
    }

    function lbInitPool() {
      const container = document.getElementById('lbRowsContainer');
      if (!container) return;
      container.innerHTML = '';
      lbRowPool = [];
      for (let i = 0; i < 12; i++) {
        const div = document.createElement('div');
        div.className = 'hidden px-3 py-1.5 items-center justify-between text-xs';
        container.appendChild(div);
        lbRowPool.push(div);
      }
    }

    function lbRenderUI(animateOvertake = false) {
      if (lbRowPool.length === 0) lbInitPool();
      const preset = LB_PRESETS[lbActiveMode];
      const { st, calc, clamped, effectiveNow } = lbAdvanceBotsAndSync(lbActiveMode);

      const jigsawSync = lbActiveMode === 'calm_jigsaw' ? calc : lbAdvanceBotsAndSync('calm_jigsaw').calc;
      const topRankEl = document.getElementById('topRankBadge');
      if (topRankEl) topRankEl.textContent = `#${jigsawSync.playerRank}`;

      state.coins = lbGetWallet();
      if (coinCount) coinCount.textContent = String(state.coins);

      const remMs = Math.max(0, st.endTimeMs - effectiveNow);
      const totalMins = Math.floor(remMs / 60000);
      const d = Math.floor(totalMins / 1440);
      const h = Math.floor((totalMins % 1440) / 60);
      const m = totalMins % 60;
      const cdEl = document.getElementById('lbCountdown');
      if (cdEl) cdEl.textContent = remMs <= 0 ? 'ENDED' : `${d}d ${String(h).padStart(2, '0')}h ${String(m).padStart(2, '0')}m`;

      const phaseEl = document.getElementById('lbPhaseBadge');
      if (phaseEl) {
        if (clamped) {
          phaseEl.textContent = '🔒 Clamped';
          phaseEl.className = 'text-xs font-mono text-rose-400 font-bold';
        } else {
          const pct = Math.min(1, Math.max(0, (effectiveNow - st.startTimeMs) / Math.max(1, st.endTimeMs - st.startTimeMs)));
          phaseEl.textContent = pct >= 1 ? 'Locked' : (pct >= 0.65 ? 'Convergence' : 'Live Sync');
          phaseEl.className = 'text-xs font-mono text-[#8b949e]';
        }
      }

      document.getElementById('lbPlayerRank').textContent = `#${calc.playerRank}/${calc.totalEntries}`;
      document.getElementById('lbScoreLabel').textContent = preset.scoringRule === 'cumulative' ? 'Score:' : 'Best:';
      document.getElementById('lbPlayerScore').textContent = lbFormatScore(st.playerEntry.score, preset);

      const deltaEl = document.getElementById('lbRankDelta');
      const netDelta = st.playerEntry.previousRank - calc.playerRank;
      if (netDelta > 0) {
        deltaEl.textContent = `▲+${netDelta}`;
        deltaEl.className = 'font-mono font-bold text-emerald-400';
      } else if (netDelta < 0) {
        deltaEl.textContent = `▼${netDelta}`;
        deltaEl.className = 'font-mono font-bold text-rose-400';
      } else {
        deltaEl.textContent = '';
      }

      const banner = document.getElementById('lbRewardBanner');
      const btnClaim = document.getElementById('lbBtnClaim');
      const btnNext = document.getElementById('lbBtnNextSeason');
      const rewardTxt = document.getElementById('lbRewardText');
      if (remMs <= 0) {
        banner.classList.remove('hidden');
        if (!st.rewardClaimed) {
          rewardTxt.textContent = `Rank #${calc.playerRank}: ${calc.rewardTier.badge} +${calc.rewardTier.coins}🪙`;
          btnClaim.textContent = '🎁 Claim';
          btnClaim.className = 'px-2 py-1 rounded-lg bg-amber-500 hover:bg-amber-400 text-[#0d1117] text-xs font-bold cursor-pointer transition';
          btnNext.classList.add('hidden');
        } else {
          rewardTxt.textContent = `Claimed ${calc.rewardTier.badge} +${calc.rewardTier.coins}🪙!`;
          btnClaim.textContent = '✓ Claimed';
          btnClaim.className = 'px-2 py-1 rounded-lg bg-[#21262d] text-[#8b949e] border border-[#30363d] text-xs font-semibold cursor-pointer';
          btnNext.classList.remove('hidden');
        }
      } else {
        banner.classList.add('hidden');
      }

      for (let i = 0; i < lbRowPool.length; i++) {
        const node = lbRowPool[i];
        const row = calc.windowedRows[i];
        if (!row) {
          node.className = 'hidden';
          node.innerHTML = '';
          continue;
        }
        if (row.isDivider) {
          node.className = 'flex items-center justify-center py-1 px-2 bg-[#161b22] text-[11px] font-mono text-[#8b949e]';
          node.innerHTML = `••• ${row.skippedCount} rivals •••`;
          continue;
        }
        const badge = row.rank === 1 ? '🥇#1' : (row.rank === 2 ? '🥈#2' : (row.rank === 3 ? '🥉#3' : `#${row.rank}`));
        let cls = 'flex px-2.5 py-1.5 items-center justify-between text-xs transition-all ';
        if (row.isPlayer) {
          cls += 'bg-amber-500/15 border-l-4 border-l-amber-400 ';
          if (animateOvertake) cls += 'snap-anim ';
        } else if (row.rank <= 3) {
          cls += 'bg-[#161b22]/50 ';
        }
        node.className = cls;

        const rTier = row.rank === 1 ? '500🪙' : (row.rank <= 3 ? '250🪙' : (row.rank <= 10 ? '100🪙' : '25🪙'));
        node.innerHTML = `
          <div class="flex items-center gap-2 min-w-0">
            <span class="w-9 font-mono font-bold ${row.isPlayer ? 'text-amber-400' : 'text-[#8b949e]'}">${badge}</span>
            <span class="w-6 h-6 rounded bg-[#21262d] border border-[#30363d] flex items-center justify-center text-xs shrink-0">${row.avatar}</span>
            <span class="font-bold truncate ${row.isPlayer ? 'text-amber-400' : 'text-[#e6edf3]'}">${row.name}</span>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <span class="text-[11px] font-mono text-[#8b949e]">${rTier}</span>
            <span class="w-16 text-right font-mono font-bold ${row.isPlayer ? 'text-amber-400' : 'text-[#e6edf3]'}">${lbFormatScore(row.score, preset)}</span>
          </div>
        `;
      }
    }

    // Right-Side Panel Tab Controls (Drawer vs Leaderboard)
    document.getElementById('tabBtnDrawer').addEventListener('click', () => {
      switchRightTab('drawer');
    });
    document.getElementById('tabBtnLeaderboard').addEventListener('click', () => {
      switchRightTab('leaderboard');
    });
    document.getElementById('btnOpenLeaderboard').addEventListener('click', () => {
      if (state.rightTab === 'leaderboard') {
        switchRightTab('drawer');
      } else {
        switchRightTab('leaderboard');
      }
    });
    document.getElementById('btnViewLbFromWin').addEventListener('click', () => {
      winOverlay.classList.add('hidden');
      switchRightTab('leaderboard');
      lbRenderUI(true);
    });

    document.getElementById('lbModeGame').addEventListener('click', () => {
      lbActiveMode = 'calm_jigsaw';
      document.getElementById('lbModeGame').className = 'px-2.5 py-1 rounded-lg bg-blue-600 text-white text-xs font-bold cursor-pointer transition';
      document.getElementById('lbModeUnified').className = 'px-2.5 py-1 rounded-lg bg-[#21262d] hover:bg-[#30363d] text-[#8b949e] hover:text-[#e6edf3] text-xs font-semibold cursor-pointer transition';
      lbRenderUI(false);
    });
    document.getElementById('lbModeUnified').addEventListener('click', () => {
      lbActiveMode = 'unified_league';
      document.getElementById('lbModeUnified').className = 'px-2.5 py-1 rounded-lg bg-blue-600 text-white text-xs font-bold cursor-pointer transition';
      document.getElementById('lbModeGame').className = 'px-2.5 py-1 rounded-lg bg-[#21262d] hover:bg-[#30363d] text-[#8b949e] hover:text-[#e6edf3] text-xs font-semibold cursor-pointer transition';
      lbRenderUI(false);
    });

    document.getElementById('lbBtnPlus4h').addEventListener('click', () => {
      lbSimOffsetMs += 4 * 3600 * 1000;
      showToast('⏩ Advanced +4h • Simulated bot progression!');
      lbRenderUI(false);
    });
    document.getElementById('lbBtnMinus6h').addEventListener('click', () => {
      lbSimOffsetMs -= 6 * 3600 * 1000;
      showToast('🔒 Clock Rollback Detected (-6h) • Clamped to High-Water Timestamp!', true);
      lbRenderUI(false);
    });
    document.getElementById('lbBtnExpire').addEventListener('click', () => {
      const st = lbLoadState(lbActiveMode);
      const rem = Math.max(0, st.endTimeMs - (Date.now() + lbSimOffsetMs));
      lbSimOffsetMs += rem + 1000;
      showToast('🏁 Season Finished! Claim your rank reward.');
      lbRenderUI(false);
    });

    document.getElementById('lbBtnClaim').addEventListener('click', () => {
      const { st, calc } = lbAdvanceBotsAndSync(lbActiveMode);
      if (st.status === 'active') return;
      if (st.rewardClaimed) {
        showToast('🛡️ Idempotent Guard: Season reward already claimed!', true);
        return;
      }
      st.rewardClaimed = true;
      st.status = 'archived';
      lbSaveState(lbActiveMode, st);
      lbSetWallet(lbGetWallet() + calc.rewardTier.coins);
      showToast(`🎁 Claimed ${calc.rewardTier.badge} ${calc.rewardTier.name} (+${calc.rewardTier.coins}🪙)!`);
      lbRenderUI(false);
    });

    document.getElementById('lbBtnNextSeason').addEventListener('click', () => {
      const st = lbLoadState(lbActiveMode);
      lbSimOffsetMs = 0;
      lbCreateSeason(lbActiveMode, (st.seasonNumber || 1) + 1);
      showToast('🌟 New Season Started!');
      lbRenderUI(false);
    });

    window.OfflineLeaderboard = {
      setWallet: lbSetWallet,
      submitRun: (modeId, rawScore) => {
        const preset = LB_PRESETS[modeId];
        if (!preset) return null;
        const { st, calc, effectiveNow } = lbAdvanceBotsAndSync(modeId);
        if (effectiveNow >= st.endTimeMs || st.status !== 'active') return null;

        const prevRank = calc.playerRank;
        st.playerEntry.previousRank = prevRank;
        st.playerEntry.runsCompleted += 1;

        if (preset.scoringRule === 'cumulative') {
          st.playerEntry.score += rawScore;
        } else {
          if (st.playerEntry.score === 0 || rawScore < st.playerEntry.score) {
            st.playerEntry.score = rawScore;
          }
        }
        const nextCalc = lbCalculateRanks(st, preset);
        st.playerEntry.currentRank = nextCalc.playerRank;
        lbSaveState(modeId, st);

        const rankDelta = prevRank - nextCalc.playerRank;
        lbRenderUI(true);
        return { prevRank, newRank: nextCalc.playerRank, rankDelta };
      }
    };

    // Live Run Timer + Real-Time Cross-Tab Sync
    setInterval(() => {
      const timerEl = document.getElementById('runTimerDisplay');
      if (timerEl && !state.runSubmitted && state.runStartTimeMs) {
        const sec = Math.max(0, Math.floor((Date.now() - state.runStartTimeMs) / 1000));
        timerEl.textContent = `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`;
      }
    }, 500);

    window.addEventListener('storage', (e) => {
      if (e.key && (e.key.startsWith(LB_STORAGE_PREFIX) || e.key === 'agy_liveops_wallet_coins')) {
        lbRenderUI(false);
      }
    });
    setInterval(() => lbRenderUI(false), 4000);

    window.addEventListener('DOMContentLoaded', () => {
      state.coins = lbGetWallet();
      initPuzzle(false);
      lbRenderUI(false);
    });
  </script>
</body>
