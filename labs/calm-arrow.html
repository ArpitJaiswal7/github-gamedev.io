  <!-- NATIVE HTML5 CANVAS 2D ARROW ESCAPE GAME ENGINE SCRIPT                    -->
  <!-- Zero-dependency pure JavaScript implementation matching Unity C# mechanics -->

  <script>
    lucide.createIcons();

    // ==========================================
    // 1. LEVEL SHAPES (Geometric & Pixel-Art)
    // ==========================================
    const LEVELS = [
      {
        id: 1,
        name: "Level 1: Star Shape",
        gridW: 16,
        gridH: 16,
        arrowLen: 3,
        color: "#38bdf8",
        shapeGenerator: (x, y, w, h) => {
          const cx = (w - 1) / 2, cy = (h - 1) / 2;
          const dx = (x - cx) / (w * 0.45), dy = (y - cy) / (h * 0.45);
          const r = Math.sqrt(dx * dx + dy * dy);
          const angle = Math.atan2(dy, dx);
          // 5-pointed star polar equation
          const starR = 0.55 + 0.38 * Math.cos(5 * angle);
          return r <= starR;
        }
      },
      {
        id: 2,
        name: "Level 2: Heart Shape",
        gridW: 18,
        gridH: 18,
        arrowLen: 4,
        color: "#f43f5e",
        shapeGenerator: (x, y, w, h) => {
          const nx = (x - (w - 1) / 2) / 6.5;
          const ny = (y - (h - 1) / 2) / 6.5 + 0.4;
          // Standard heart implicit formula
          const a = nx * nx + ny * ny - 1;
          return (a * a * a - nx * nx * ny * ny * ny) <= 0.05;
        }
      },
      {
        id: 3,
        name: "Level 3: Pixel Sword",
        gridW: 18,
        gridH: 18,
        arrowLen: 4,
        color: "#a855f7",
        shapeGenerator: (x, y, w, h) => {
          const cx = Math.floor(w / 2);
          // Blade
          if (y >= 4 && y <= 15 && Math.abs(x - cx) <= (y === 15 ? 0 : (y === 14 ? 1 : 1))) return true;
          // Guard
          if (y === 5 && Math.abs(x - cx) <= 4) return true;
          // Hilt
          if (y >= 1 && y <= 4 && Math.abs(x - cx) <= 0) return true;
          // Pommel
          if (y === 1 && Math.abs(x - cx) <= 1) return true;
          return false;
        }
      },
      {
        id: 4,
        name: "Level 4: Cat Silhouette",
        gridW: 20,
        gridH: 20,
        arrowLen: 4,
        color: "#f59e0b",
        shapeGenerator: (x, y, w, h) => {
          const cx = Math.floor(w / 2), cy = Math.floor(h / 2);
          // Head / Body
          const dx = (x - cx) / 6.5, dy = (y - cy) / 6.5;
          if (dx * dx + dy * dy <= 1.0) return true;
          // Ears
          if (y >= cy + 4 && y <= cy + 8) {
            if (Math.abs(x - (cx - 4)) <= (cy + 8 - y)) return true;
            if (Math.abs(x - (cx + 4)) <= (cy + 8 - y)) return true;
          }
          return false;
        }
      },
      {
        id: 5,
        name: "Level 5: Diamond Crown",
        gridW: 22,
        gridH: 22,
        arrowLen: 5,
        color: "#10b981",
        shapeGenerator: (x, y, w, h) => {
          const cx = (w - 1) / 2, cy = (h - 1) / 2;
          // Base
          if (y >= 4 && y <= 7 && Math.abs(x - cx) <= 7) return true;
          // 3 Crown peaks
          if (y >= 8 && y <= 15) {
            if (Math.abs(x - cx) <= (15 - y) * 0.8) return true;
            if (Math.abs(x - (cx - 6)) <= (14 - y) * 0.7) return true;
            if (Math.abs(x - (cx + 6)) <= (14 - y) * 0.7) return true;
          }
          return false;
        }
      },
      {
        id: 6,
        name: "Level 6: Eagle Crest",
        gridW: 24,
        gridH: 24,
        arrowLen: 5,
        color: "#38bdf8",
        shapeGenerator: (x, y, w, h) => {
          const cx = (w - 1) / 2;
          // Body
          if (Math.abs(x - cx) <= 2 && y >= 3 && y <= 19) return true;
          // Swept Wings
          const wingSpread = Math.abs(x - cx);
          if (wingSpread >= 3 && wingSpread <= 10) {
            const wingY = 12 + Math.sin((wingSpread - 3) / 7 * Math.PI) * 4;
            if (Math.abs(y - wingY) <= 2) return true;
          }
          return false;
        }
      }
    ];

    // ==========================================
    // 2. DIRECTION CONSTANTS & UTILITIES
    // ==========================================
    const DIRS = {
      Up:    { name: 'Up',    dx: 0,  dy: 1,  screenAngle: -Math.PI / 2 },
      Down:  { name: 'Down',  dx: 0,  dy: -1, screenAngle: Math.PI / 2 },
      Left:  { name: 'Left',  dx: -1, dy: 0,  screenAngle: Math.PI },
      Right: { name: 'Right', dx: 1,  dy: 0,  screenAngle: 0 }
    };
    const DIR_LIST = [DIRS.Up, DIRS.Down, DIRS.Left, DIRS.Right];

    // ==========================================
    // 3. GAME STATE
    // ==========================================
    let currentLevelIndex = 0;
    let currentLives = 3;
    const MAX_LIVES = 3;
    let gridW = 16, gridH = 16;
    let activeCoords = [];
    let arrows = []; // Array of Arrow objects
    let occupancyMap = new Map(); // "x,y" -> Arrow
    let isInteractingLocked = false;
    let reverseSolveOrder = []; // Stack of arrows in solve order

    const canvas = document.getElementById("arrow-game-canvas");
    const ctx = canvas.getContext("2d");
    let cellPixelSize = 24;
    let originPixelX = 0, originPixelY = 0;

    // Toast UI
    const toastEl = document.getElementById("canvas-toast");
    const toastMsgEl = document.getElementById("canvas-toast-msg");
    const toastIconEl = document.getElementById("canvas-toast-icon");
    let toastTimeout = null;

    function showGameToast(msg, icon = "✨", isAlert = false) {
      if (toastTimeout) clearTimeout(toastTimeout);
      toastMsgEl.textContent = msg;
      toastIconEl.textContent = icon;
      toastEl.className = `pointer-events-none absolute top-4 transform translate-y-0 opacity-100 transition-all duration-300 px-4 py-2 rounded-xl shadow-2xl text-xs font-bold text-white flex items-center gap-2 ${
        isAlert ? 'bg-rose-950/95 border border-rose-500/80 text-rose-200' : 'bg-slate-900/95 border border-sky-400/80'
      }`;
      toastTimeout = setTimeout(() => {
        toastEl.className = "pointer-events-none absolute top-4 transform -translate-y-10 opacity-0 transition-all duration-300 px-4 py-2 rounded-xl bg-slate-900/95 border border-sky-400/80 shadow-2xl text-xs font-bold text-white flex items-center gap-2";
      }, 2500);
    }

    function updateLivesHUD() {
      const hearts = "❤️".repeat(Math.max(0, currentLives)) + "🖤".repeat(Math.max(0, MAX_LIVES - currentLives));
      document.getElementById("hud-lives-icons").textContent = hearts;
      document.getElementById("hud-lives-text").textContent = `${currentLives}/${MAX_LIVES}`;
    }

    // ==========================================
    // 4. GUARANTEED-SOLVABLE ARROW GENERATOR (Matches Unity SolvableShapeGenerator)
    // ==========================================
    function generateSolvableLevel(config) {
      gridW = config.gridW;
      gridH = config.gridH;
      activeCoords = [];
      occupancyMap.clear();
      arrows = [];
      reverseSolveOrder = [];

      // 1. Build shape mask
      const remaining = new Set();
      for (let x = 0; x < gridW; x++) {
        for (let y = 0; y < gridH; y++) {
          if (config.shapeGenerator(x, y, gridW, gridH)) {
            const key = `${x},${y}`;
            remaining.add(key);
            activeCoords.push({ x, y });
          }
        }
      }

      const coordFromKey = (k) => {
        const [x, y] = k.split(',').map(Number);
        return { x, y };
      };

      let arrowId = 1;
      const targetLen = config.arrowLen || 4;

      // 2. Outside-In Reverse Solve Order Peeling Loop
      while (remaining.size > 0) {
        const candidates = [];

        remaining.forEach(k => {
          const head = coordFromKey(k);

          for (let dir of DIR_LIST) {
            // CRITICAL: Neck MUST be directly behind head in direction -dir!
            const neck = { x: head.x - dir.dx, y: head.y - dir.dy };
            const neckKey = `${neck.x},${neck.y}`;

            if (!remaining.has(neckKey)) continue;

            // Test if ray from head in dir toward grid boundary intersects any remaining cell
            let probeX = head.x + dir.dx;
            let probeY = head.y + dir.dy;
            let clearRay = true;
            while (probeX >= 0 && probeX < gridW && probeY >= 0 && probeY < gridH) {
              if (remaining.has(`${probeX},${probeY}`)) {
                clearRay = false;
                break;
              }
              probeX += dir.dx;
              probeY += dir.dy;
            }

            if (clearRay) {
              let score = 10;
              let headDeg = 0;
              for (let d of DIR_LIST) {
                if (remaining.has(`${head.x + d.dx},${head.y + d.dy}`)) headDeg++;
              }
              if (headDeg === 1) score += 6; // leaf tips are ideal to peel
              candidates.push({ head, neck, dir, score });
            }
          }
        });

        if (candidates.length === 0) {
          // Fallback if isolated 1-cell or concave corner
          const firstKey = remaining.values().next().value;
          const pt = coordFromKey(firstKey);
          candidates.push({ head: pt, neck: null, dir: DIRS.Up, score: 0 });
        }

        // Pick highest priority candidate
        candidates.sort((a, b) => b.score - a.score);
        const cand = candidates[0];

        const reversedPath = [cand.head];
        remaining.delete(`${cand.head.x},${cand.head.y}`);

        if (cand.neck) {
          reversedPath.push(cand.neck);
          remaining.delete(`${cand.neck.x},${cand.neck.y}`);

          // Grow tail backwards from neck into remaining cells
          let current = cand.neck;
          let prevStepDir = { x: cand.neck.x - cand.head.x, y: cand.neck.y - cand.head.y };

          while (reversedPath.length < targetLen) {
            const validNext = [];
            let orphanRescue = null;

            for (let d of DIR_LIST) {
              const nx = current.x + d.dx;
              const ny = current.y + d.dy;
              const nk = `${nx},${ny}`;
              if (remaining.has(nk)) {
                let deg = 0;
                for (let nd of DIR_LIST) {
                  if (remaining.has(`${nx + nd.dx},${ny + nd.dy}`)) deg++;
                }
                if (deg === 0) orphanRescue = { x: nx, y: ny, key: nk };
                validNext.push({ pt: { x: nx, y: ny }, key: nk, deg });
              }
            }

            if (validNext.length === 0) break;

            let chosen;
            if (orphanRescue) {
              chosen = orphanRescue;
            } else {
              const straightX = current.x + prevStepDir.x;
              const straightY = current.y + prevStepDir.y;
              const straightCand = validNext.find(v => v.pt.x === straightX && v.pt.y === straightY);
              if (straightCand && Math.random() < 0.65) {
                chosen = straightCand;
              } else {
                validNext.sort((a, b) => a.deg - b.deg);
                chosen = validNext[0];
              }
            }

            prevStepDir = { x: chosen.pt.x - current.x, y: chosen.pt.y - current.y };
            current = chosen.pt;
            reversedPath.push(current);
            remaining.delete(chosen.key || `${chosen.pt.x},${chosen.pt.y}`);
          }
        }

        // Reverse so path[0] = tail, path[last] = head
        const arrowPath = reversedPath.slice().reverse();
        const arrow = new ArrowInstance(arrowId++, arrowPath, cand.dir, config.color);
        arrows.push(arrow);
        reverseSolveOrder.push(arrow);
      }

      // Mark initial occupancy
      arrows.forEach(a => a.markOccupied());
    }

    // ==========================================
    // 5. ARROW CLASS (Movement, Rebound, Render)
    // ==========================================
    class ArrowInstance {
      constructor(id, path, dir, baseColor) {
        this.id = id;
        this.path = path.map(p => ({ x: p.x, y: p.y })); // [0] = tail, [last] = head
        this.originalPath = path.map(p => ({ x: p.x, y: p.y }));
        this.dir = dir; // Movement direction & facing direction
        this.baseColor = baseColor;
        this.isMoving = false;
        this.isCleared = false;
        this.animPositions = this.path.map(p => ({ x: p.x, y: p.y }));
        this.bonkOffset = { x: 0, y: 0 };
        this.isHinted = false;
      }

      markOccupied() {
        this.path.forEach(p => {
          occupancyMap.set(`${p.x},${p.y}`, this);
        });
      }

      markFree() {
        this.path.forEach(p => {
          if (occupancyMap.get(`${p.x},${p.y}`) === this) {
            occupancyMap.delete(`${p.x},${p.y}`);
          }
        });
      }

      containsPoint(gridX, gridY) {
        return this.path.some(p => p.x === gridX && p.y === gridY);
      }

      // Step-by-step advance until obstacle or exit
      async triggerClick() {
        if (this.isMoving || this.isCleared || isInteractingLocked) return;
        this.isMoving = true;
        this.isHinted = false;

        const pathHistory = [this.path.map(p => ({ ...p }))];
        let wasBlocked = false;

        while (true) {
          const head = this.path[this.path.length - 1];
          const nextHead = { x: head.x + this.dir.dx, y: head.y + this.dir.dy };

          // Check obstacle inside grid
          if (nextHead.x >= 0 && nextHead.x < gridW && nextHead.y >= 0 && nextHead.y < gridH) {
            const occ = occupancyMap.get(`${nextHead.x},${nextHead.y}`);
            if (occ && occ !== this) {
              wasBlocked = true;
              break;
            }
          }

          // Check if head escaped past boundary
          if (nextHead.x < 0 || nextHead.x >= gridW || nextHead.y < 0 || nextHead.y >= gridH) {
            break;
          }

          // Advance 1 cell forward
          const oldTail = this.path[0];
          occupancyMap.delete(`${oldTail.x},${oldTail.y}`);

          for (let i = 0; i < this.path.length - 1; i++) {
            this.path[i] = { ...this.path[i + 1] };
          }
          this.path[this.path.length - 1] = nextHead;
          occupancyMap.set(`${nextHead.x},${nextHead.y}`, this);

          pathHistory.push(this.path.map(p => ({ ...p })));
          await this.animateStep(0.045);
        }

        if (wasBlocked) {
          // Play Bonk Bump against obstacle
          currentLives--;
          updateLivesHUD();
          showGameToast(`Blocked by obstacle! -1 Life (${currentLives} left)`, "💥", true);

          await this.animateBonkBump();

          if (currentLives <= 0) {
            showGameToast("Game Over! All lives lost.", "💀", true);
            showGameOverModal();
            this.isMoving = false;
            return;
          }

          // Snake back step-by-step to original grid set
          for (let s = pathHistory.length - 2; s >= 0; s--) {
            const curHead = this.path[this.path.length - 1];
            occupancyMap.delete(`${curHead.x},${curHead.y}`);

            this.path = pathHistory[s].map(p => ({ ...p }));
            this.path.forEach(p => occupancyMap.set(`${p.x},${p.y}`, this));

            await this.animateStep(0.035);
          }

          this.isMoving = false;
          return;
        }

        // Unblocked! Slide off grid and clear
        this.markFree();
        for (let exit = 0; exit < this.path.length + 2; exit++) {
          const nextHead = {
            x: this.path[this.path.length - 1].x + this.dir.dx,
            y: this.path[this.path.length - 1].y + this.dir.dy
          };
          for (let i = 0; i < this.path.length - 1; i++) {
            this.path[i] = { ...this.path[i + 1] };
          }
          this.path[this.path.length - 1] = nextHead;
          await this.animateStep(0.035);
        }

        this.isCleared = true;
        this.isMoving = false;
        checkWinCondition();
      }

      animateStep(durationSec) {
        return new Promise(resolve => {
          const starts = this.animPositions.map(p => ({ ...p }));
          const targets = this.path.map(p => ({ ...p }));
          const startTime = performance.now();
          const durationMs = durationSec * 1000;

          const stepLoop = (now) => {
            const elapsed = now - startTime;
            const t = Math.min(1, elapsed / durationMs);
            for (let i = 0; i < this.animPositions.length; i++) {
              this.animPositions[i].x = starts[i].x + (targets[i].x - starts[i].x) * t;
              this.animPositions[i].y = starts[i].y + (targets[i].y - starts[i].y) * t;
            }
            if (t < 1) {
              requestAnimationFrame(stepLoop);
            } else {
              this.animPositions = this.path.map(p => ({ ...p }));
              resolve();
            }
          };
          requestAnimationFrame(stepLoop);
        });
      }

      animateBonkBump() {
        return new Promise(resolve => {
          const startTime = performance.now();
          const bumpDuration = 120; // ms
          const maxNudge = 0.35; // cells

          const bumpLoop = (now) => {
            const elapsed = now - startTime;
            const t = elapsed / bumpDuration;
            if (t < 0.5) {
              const p = t * 2;
              this.bonkOffset.x = this.dir.dx * maxNudge * p;
              this.bonkOffset.y = this.dir.dy * maxNudge * p;
            } else if (t <= 1) {
              const p = (1 - t) * 2;
              this.bonkOffset.x = this.dir.dx * maxNudge * p;
              this.bonkOffset.y = this.dir.dy * maxNudge * p;
            } else {
              this.bonkOffset = { x: 0, y: 0 };
              resolve();
              return;
            }
            requestAnimationFrame(bumpLoop);
          };
          requestAnimationFrame(bumpLoop);
        });
      }

      render(ctx) {
        if (this.isCleared) return;
        const pts = this.animPositions;
        if (pts.length < 2) return;

        // Convert grid coords to canvas pixel coords
        // (p.y = 0 is bottom row, gridH - 1 is top row)
        const pixelPts = pts.map(p => ({
          x: originPixelX + (p.x + this.bonkOffset.x + 0.5) * cellPixelSize,
          y: originPixelY + (gridH - 1 - (p.y + this.bonkOffset.y) + 0.5) * cellPixelSize
        }));

        ctx.save();

        // Glow when hinted
        if (this.isHinted) {
          ctx.shadowColor = '#facc15';
          ctx.shadowBlur = 16;
        }

        // Draw LineRenderer Body
        ctx.beginPath();
        ctx.moveTo(pixelPts[0].x, pixelPts[0].y);
        for (let i = 1; i < pixelPts.length; i++) {
          ctx.lineTo(pixelPts[i].x, pixelPts[i].y);
        }

        ctx.lineWidth = cellPixelSize * 0.62;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // Gradient styling
        const grad = ctx.createLinearGradient(
          pixelPts[0].x, pixelPts[0].y,
          pixelPts[pixelPts.length - 1].x, pixelPts[pixelPts.length - 1].y
        );
        grad.addColorStop(0, this.baseColor + 'aa');
        grad.addColorStop(1, this.baseColor);

        ctx.strokeStyle = grad;
        ctx.stroke();

        // Inner highlight core
        ctx.lineWidth = cellPixelSize * 0.22;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
        ctx.stroke();

        // Directional Chevron Arrowhead at tip:
        // Position directly at the head pixel position and rotate strictly by this.dir.screenAngle
        const headPt = pixelPts[pixelPts.length - 1];

        ctx.save();
        ctx.translate(headPt.x, headPt.y);
        ctx.rotate(this.dir.screenAngle);

        const headSize = cellPixelSize * 0.55;
        ctx.beginPath();
        ctx.moveTo(headSize * 0.65, 0);
        ctx.lineTo(-headSize * 0.45, -headSize * 0.55);
        ctx.lineTo(-headSize * 0.15, 0);
        ctx.lineTo(-headSize * 0.45, headSize * 0.55);
        ctx.closePath();

        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = 'rgba(0,0,0,0.5)';
        ctx.shadowBlur = 4;
        ctx.fill();

        ctx.restore();
        ctx.restore();
      }
    }

    // ==========================================
    // 6. MAIN RENDER LOOP & CANVAS SIZING
    // ==========================================
    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const displayW = Math.max(320, rect.width || (canvas.parentElement ? canvas.parentElement.clientWidth : 0) || 960);
      const displayH = Math.max(240, rect.height || (canvas.parentElement ? canvas.parentElement.clientHeight : 0) || 540);

      canvas.width = Math.floor(displayW * dpr);
      canvas.height = Math.floor(displayH * dpr);
      ctx.resetTransform();
      ctx.scale(dpr, dpr);

      // Compute cell size and origin to fit active shape
      const padding = 32;
      const availW = displayW - padding * 2;
      const availH = displayH - padding * 2;

      cellPixelSize = Math.floor(Math.min(availW / Math.max(1, gridW), availH / Math.max(1, gridH)));
      cellPixelSize = Math.max(14, Math.min(36, cellPixelSize));

      const totalGridPixelW = gridW * cellPixelSize;
      const totalGridPixelH = gridH * cellPixelSize;

      originPixelX = Math.floor((displayW - totalGridPixelW) / 2);
      originPixelY = Math.floor((displayH - totalGridPixelH) / 2);
    }

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('load', resizeCanvas);

    function mainDrawLoop() {
      const displayW = canvas.width / (window.devicePixelRatio || 1);
      const displayH = canvas.height / (window.devicePixelRatio || 1);
      ctx.clearRect(0, 0, displayW, displayH);

      // 1. Draw subtle board cell tiles for active mask coordinates
      ctx.fillStyle = 'rgba(30, 41, 59, 0.45)';
      ctx.strokeStyle = 'rgba(51, 65, 85, 0.3)';
      ctx.lineWidth = 1;

      for (let pt of activeCoords) {
        const px = originPixelX + pt.x * cellPixelSize;
        const py = originPixelY + (gridH - 1 - pt.y) * cellPixelSize;
        const inset = 1;

        ctx.beginPath();
        ctx.roundRect(px + inset, py + inset, cellPixelSize - inset * 2, cellPixelSize - inset * 2, 4);
        ctx.fill();
        ctx.stroke();
      }

      // 2. Draw Arrows
      arrows.forEach(a => a.render(ctx));

      requestAnimationFrame(mainDrawLoop);
    }

    // ==========================================
    // 7. INPUT HANDLING & CLICK DETECTION
    // ==========================================
    canvas.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.clientX - rect.left;
      const clientY = e.clientY - rect.top;

      const gridX = Math.floor((clientX - originPixelX) / cellPixelSize);
      const gridY = gridH - 1 - Math.floor((clientY - originPixelY) / cellPixelSize);

      if (gridX >= 0 && gridX < gridW && gridY >= 0 && gridY < gridH) {
        const clickedArrow = occupancyMap.get(`${gridX},${gridY}`);
        if (clickedArrow) {
          clickedArrow.triggerClick();
        }
      }
    });

    // ==========================================
    // 8. LEVEL PROGRESSION, WIN / LOSE
    // ==========================================
    function loadLevel(index) {
      currentLevelIndex = index;
      currentLives = MAX_LIVES;
      updateLivesHUD();
      document.getElementById("canvas-game-modal").classList.add("hidden");

      const config = LEVELS[currentLevelIndex];
      generateSolvableLevel(config);
      resizeCanvas();
      showGameToast(`Loaded ${config.name}`, "🚀");
    }

    function checkWinCondition() {
      const remainingArrows = arrows.filter(a => !a.isCleared);
      if (remainingArrows.length === 0) {
        setTimeout(() => {
          showWinModal();
        }, 200);
      }
    }

    const modalEl = document.getElementById("canvas-game-modal");
    const modalTitleEl = document.getElementById("modal-title");
    const modalSubtitleEl = document.getElementById("modal-subtitle");
    const modalBadgeEl = document.getElementById("modal-badge-icon");
    const modalStatShape = document.getElementById("modal-stat-shape");
    const modalStatLives = document.getElementById("modal-stat-lives");
    const modalActionText = document.getElementById("modal-action-text");
    const btnModalAction = document.getElementById("btn-modal-action");
    const confettiCanvas = document.getElementById("modal-confetti-canvas");
    let confettiAnimationId = null;

    function startConfetti() {
      if (!confettiCanvas) return;
      const cCtx = confettiCanvas.getContext("2d");
      const rect = modalEl.getBoundingClientRect();
      confettiCanvas.width = rect.width;
      confettiCanvas.height = rect.height;

      const particles = [];
      const colors = ["#38bdf8", "#f59e0b", "#10b981", "#ec4899", "#a855f7", "#ffffff"];
      for (let i = 0; i < 75; i++) {
        particles.push({
          x: Math.random() * confettiCanvas.width,
          y: -20 - Math.random() * 100,
          w: 6 + Math.random() * 6,
          h: 8 + Math.random() * 8,
          color: colors[Math.floor(Math.random() * colors.length)],
          vx: -2 + Math.random() * 4,
          vy: 2 + Math.random() * 4,
          rot: Math.random() * Math.PI,
          vRot: -0.1 + Math.random() * 0.2
        });
      }

      function loop() {
        cCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.vRot;

          cCtx.save();
          cCtx.translate(p.x, p.y);
          cCtx.rotate(p.rot);
          cCtx.fillStyle = p.color;
          cCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          cCtx.restore();

          if (p.y > confettiCanvas.height + 20) {
            p.y = -20;
            p.x = Math.random() * confettiCanvas.width;
          }
        });
        confettiAnimationId = requestAnimationFrame(loop);
      }
      if (confettiAnimationId) cancelAnimationFrame(confettiAnimationId);
      loop();
    }

    function stopConfetti() {
      if (confettiAnimationId) {
        cancelAnimationFrame(confettiAnimationId);
        confettiAnimationId = null;
      }
      if (confettiCanvas) {
        const cCtx = confettiCanvas.getContext("2d");
        cCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      }
    }

    function showWinModal() {
      const config = LEVELS[currentLevelIndex];
      const isLastLevel = (currentLevelIndex === LEVELS.length - 1);

      modalBadgeEl.textContent = isLastLevel ? "🏆" : "🎉";
      modalBadgeEl.className = "w-20 h-20 rounded-3xl bg-gradient-to-tr from-amber-500/25 to-emerald-500/25 border-2 border-amber-400/60 flex items-center justify-center text-4xl shadow-2xl shadow-amber-500/30";
      
      modalTitleEl.textContent = isLastLevel ? "Game Completed!" : "Level Cleared!";
      modalSubtitleEl.textContent = isLastLevel 
        ? "Legendary puzzle mastery! You have solved all shapes in Arrow Escape."
        : `Outstanding solve! All arrows in ${config.name.split(':')[1].trim()} escaped cleanly.`;

      modalStatShape.textContent = config.name.split(':')[1].trim();
      modalStatLives.textContent = `${"❤️".repeat(currentLives)} ${currentLives}/${MAX_LIVES}`;

      // Star rating based on lives remaining
      const star1 = document.getElementById("modal-star-1");
      const star2 = document.getElementById("modal-star-2");
      const star3 = document.getElementById("modal-star-3");

      star1.className = currentLives >= 1 ? "text-amber-400 animate-bounce" : "text-slate-600";
      star2.className = currentLives >= 2 ? "text-amber-400 animate-bounce delay-100" : "text-slate-600";
      star3.className = currentLives >= 3 ? "text-amber-400 animate-bounce delay-200" : "text-slate-600";

      document.getElementById("modal-stars-container").classList.remove("hidden");
      modalActionText.textContent = isLastLevel ? "Play Again" : "Next Level";

      modalEl.classList.remove("hidden");
      startConfetti();
      showGameToast("VICTORY! Level Cleared!", "🏆");
    }

    function showGameOverModal() {
      stopConfetti();
      modalBadgeEl.textContent = "💔";
      modalBadgeEl.className = "w-20 h-20 rounded-3xl bg-rose-500/20 border-2 border-rose-500/40 flex items-center justify-center text-4xl shadow-2xl shadow-rose-500/20";
      modalTitleEl.textContent = "Game Over!";
      modalSubtitleEl.textContent = "You ran out of lives. Better luck on this solve!";
      
      const config = LEVELS[currentLevelIndex];
      modalStatShape.textContent = config.name.split(':')[1].trim();
      modalStatLives.textContent = "0/3 Lives Left";

      document.getElementById("modal-stars-container").classList.add("hidden");
      modalActionText.textContent = "Try Again";

      modalEl.classList.remove("hidden");
    }

    btnModalAction.addEventListener("click", () => {
      stopConfetti();
      if (modalTitleEl.textContent.includes("Cleared")) {
        currentLevelIndex = (currentLevelIndex + 1) % LEVELS.length;
        document.getElementById("canvas-level-select").value = currentLevelIndex;
      } else if (modalTitleEl.textContent.includes("Completed")) {
        currentLevelIndex = 0;
        document.getElementById("canvas-level-select").value = 0;
      }
      loadLevel(currentLevelIndex);
    });

    document.getElementById("btn-modal-retry").addEventListener("click", () => {
      stopConfetti();
      loadLevel(currentLevelIndex);
    });

    // Reset Level Button
    document.getElementById("btn-reset-level").addEventListener("click", () => {
      loadLevel(currentLevelIndex);
    });

    // Hint Button (Highlights next arrow that has clear escape path)
    document.getElementById("btn-hint").addEventListener("click", () => {
      arrows.forEach(a => a.isHinted = false);
      const uncleared = arrows.filter(a => !a.isCleared && !a.isMoving);

      // Find an arrow whose escape path is clear
      for (let a of uncleared) {
        const head = a.path[a.path.length - 1];
        let probeX = head.x + a.dir.dx;
        let probeY = head.y + a.dir.dy;
        let isClear = true;
        while (probeX >= 0 && probeX < gridW && probeY >= 0 && probeY < gridH) {
          const occ = occupancyMap.get(`${probeX},${probeY}`);
          if (occ && occ !== a) {
            isClear = false;
            break;
          }
          probeX += a.dir.dx;
          probeY += a.dir.dy;
        }
        if (isClear) {
          a.isHinted = true;
          showGameToast(`Hint: Arrow #${a.id} (${a.dir.name}) is free to escape!`, "💡");
          return;
        }
      }
      showGameToast("No arrow has a direct escape path right now.", "⚠️");
    });

    // Populate Level Select Dropdown
    const selectEl = document.getElementById("canvas-level-select");
    LEVELS.forEach((lvl, idx) => {
      const opt = document.createElement("option");
      opt.value = idx;
      opt.textContent = `${idx + 1}. ${lvl.name.split(':')[1].trim()}`;
      selectEl.appendChild(opt);
    });
    selectEl.addEventListener("change", (e) => {
      loadLevel(parseInt(e.target.value));
    });

    // ==========================================
    // 9. ENGINE SWITCHER (HTML5 Canvas vs Unity)
    // ==========================================
    const btnModeCanvas = document.getElementById("btn-mode-canvas");
    const btnModeUnity = document.getElementById("btn-mode-unity");
    const canvasWrapper = document.getElementById("canvas-engine-wrapper");
    const unityWrapper = document.getElementById("unity-engine-wrapper");
    const canvasHUD = document.getElementById("canvas-hud-controls");
    const unityHUD = document.getElementById("unity-hud-controls");

    btnModeCanvas.addEventListener("click", () => {
      btnModeCanvas.className = "px-3 py-1 rounded-lg bg-sky-500 text-slate-950 font-bold transition-all flex items-center gap-1.5 shadow-sm";
      btnModeUnity.className = "px-3 py-1 rounded-lg text-slate-400 hover:text-white transition-all flex items-center gap-1.5";
      canvasWrapper.classList.remove("hidden");
      unityWrapper.classList.add("hidden");
      canvasHUD.classList.remove("hidden");
      unityHUD.classList.add("hidden");
      resizeCanvas();
    });

    btnModeUnity.addEventListener("click", () => {
      btnModeUnity.className = "px-3 py-1 rounded-lg bg-sky-500 text-slate-950 font-bold transition-all flex items-center gap-1.5 shadow-sm";
      btnModeCanvas.className = "px-3 py-1 rounded-lg text-slate-400 hover:text-white transition-all flex items-center gap-1.5";
      unityWrapper.classList.remove("hidden");
      canvasWrapper.classList.add("hidden");
      unityHUD.classList.remove("hidden");
      canvasHUD.classList.add("hidden");
    });

    // Fullscreen Container Toggle
    document.getElementById("btn-fullscreen-toggle").addEventListener("click", () => {
      const container = document.getElementById("game-outer-container");
      if (!document.fullscreenElement) {
        container.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen();
      }
    });

    // Unity WebGL iframe controls
    const unityIframe = document.getElementById("webgl-game-iframe");
    let unityPortActive = false;
    document.getElementById("btn-toggle-unity-port").addEventListener("click", () => {
      unityPortActive = !unityPortActive;
      unityIframe.src = unityPortActive ? "http://127.0.0.1:8080/unity-calm-arrow/index.html" : "unity-calm-arrow/index.html";
      document.getElementById("unity-source-label").textContent = unityPortActive ? "Port: 8080" : "Local WebGL";
    });
    document.getElementById("btn-reload-unity").addEventListener("click", () => {
      unityIframe.src = unityIframe.src.split('?')[0] + '?t=' + Date.now();
    });

    // Initialize Game
    loadLevel(0);
    requestAnimationFrame(mainDrawLoop);
  </script>
</body>
