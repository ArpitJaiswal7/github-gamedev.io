<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calm Jigsaw Solitaire — Playable Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    @keyframes groupJoinPulse {
      0% { transform: scale(1); filter: brightness(1); }
      35% { transform: scale(1.025); filter: brightness(1.28) drop-shadow(0 0 14px rgba(56, 189, 248, 0.85)); }
      100% { transform: scale(1); filter: brightness(1); }
    }
    .group-join-anim {
      animation: groupJoinPulse 0.44s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 25 !important;
    }
    @keyframes ringExpand {
      0% { transform: translate(-50%, -50%) scale(0.35); opacity: 0.95; }
      100% { transform: translate(-50%, -50%) scale(1.55); opacity: 0; }
    }
    .effect-ring {
      position: absolute;
      border-radius: 9999px;
      pointer-events: none;
      animation: ringExpand 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .card-shadow-dragging {
      filter: drop-shadow(0 16px 26px rgba(0, 0, 0, 0.78));
    }
  </style>
</head>
<body class="bg-[#0d1117] text-[#e6edf3] antialiased h-screen w-screen overflow-hidden flex flex-col items-center justify-center p-2 sm:p-3 select-none">

  <!-- Hidden File Input for "Select from Explorer" -->
  <input id="fileInput" type="file" accept="image/*" class="hidden" />

  <!-- Main App Shell (Matches Calm Jigsaw & Meowsweeper #161b22 card + #30363d border theme) -->
  <div id="appShell" class="w-full max-w-[1050px] h-full flex flex-col bg-[#161b22] border border-[#30363d] rounded-2xl shadow-lg overflow-hidden relative">

    <!-- 1. COMPACT TOP HEADER: Row 1 (Title + Inline Merged Indicator + Controls) & Row 2 (Single Line Powerups) -->
    <header class="border-b border-[#30363d] bg-[#161b22] px-3.5 py-2 flex flex-col gap-1.5 shrink-0 z-10">
      <!-- Top Row: Title + Inline Connected Progress + Photo Dropdown + Grid Dropdown + Shuffle + Coins -->
      <div class="flex items-center justify-between gap-2 flex-nowrap overflow-x-auto">
        <!-- Left: Game Title + Inline Connected Badge -->
        <div class="flex items-center gap-2 shrink-0">
          <span class="inline-flex items-center justify-center w-7 h-7 rounded-lg bg-[#21262d] border border-[#30363d] text-[#e6edf3] font-bold text-xs">
            🃏
          </span>
          <h1 class="font-bold text-sm sm:text-base text-[#e6edf3] whitespace-nowrap">Calm Jigsaw Solitaire</h1>
          <span id="progressText" class="px-2 py-0.5 rounded bg-emerald-500/15 text-emerald-400 border border-emerald-500/30 text-xs font-semibold whitespace-nowrap">
            0/16 Connected
          </span>
        </div>

        <!-- Right: Inline Controls (Photo Select, Grid Select, Shuffle, Coins) -->
        <div class="flex items-center gap-1.5 shrink-0">
          <select id="sceneSelect" class="bg-[#21262d] hover:bg-[#30363d] text-[#e6edf3] border border-[#30363d] rounded-lg px-2 py-1 text-xs font-semibold cursor-pointer focus:outline-none transition">
            <option value="sunset">🌅 Alpine Sunset</option>
            <option value="flamingo">🦩 Flamingo Lagoon</option>
            <option value="forest">🌲 Misty Pines</option>
            <option value="coast">🌊 Calm Cove</option>
            <option value="custom" id="customPhotoOption" hidden>🖼️ Custom Photo</option>
            <option value="explorer">📁 Select from Explorer...</option>
          </select>

          <select id="gridSelect" class="bg-[#21262d] hover:bg-[#30363d] text-[#e6edf3] border border-[#30363d] rounded-lg px-2 py-1 text-xs font-semibold cursor-pointer focus:outline-none transition">
            <option value="3x3">3 × 3 (9)</option>
            <option value="4x3">4 × 3 (12)</option>
            <option value="4x4" selected>4 × 4 (16)</option>
            <option value="5x4">5 × 4 (20)</option>
            <option value="5x5">5 × 5 (25)</option>
            <option value="6x5">6 × 5 (30)</option>
            <option value="6x6">6 × 6 (36)</option>
          </select>

          <button id="btnShuffle" title="Shuffle Unconnected Cards" class="inline-flex items-center justify-center gap-1 bg-blue-600 text-white hover:bg-blue-500 active:scale-95 transition border border-blue-500 rounded-lg px-2.5 py-1 text-xs font-semibold cursor-pointer whitespace-nowrap">
            <span>🔀</span>
            <span>Shuffle</span>
          </button>

          <div class="flex items-center gap-1 bg-[#0d1117] border border-[#30363d] px-2 py-1 rounded-lg text-xs font-mono font-bold text-[#e6edf3] whitespace-nowrap">
            <span class="text-[#8b949e]">⏱️</span>
            <span id="runTimerDisplay">00:00</span>
          </div>

          <button id="btnOpenLeaderboard" title="Toggle Live Offline Leaderboard" class="inline-flex items-center justify-center gap-1 bg-blue-600 text-white active:scale-95 transition border border-blue-500 rounded-lg px-2.5 py-1 text-xs font-semibold cursor-pointer whitespace-nowrap">
            <span>🏆</span>
            <span id="topRankBadge" class="text-amber-400 font-bold font-mono">#30</span>
          </button>

          <div class="flex items-center gap-1 bg-amber-500/20 text-amber-400 px-2.5 py-1 rounded-lg text-xs font-bold border border-amber-500/30 whitespace-nowrap">
            <span>🪙</span>
            <span id="coinCount">150</span>
          </div>
        </div>
      </div>

      <!-- Second Row: Strictly 1 Line for Powerups -->
      <div class="flex items-center gap-1.5 overflow-x-auto">
        <button id="btnHint" title="Swap a card to connect with its matching neighbor" class="flex-1 flex items-center justify-center gap-1.5 py-1 px-2.5 rounded-xl bg-[#21262d] hover:bg-[#30363d] active:scale-95 transition text-[#e6edf3] border border-[#30363d] text-xs font-semibold cursor-pointer whitespace-nowrap">
          <span>💡</span>
          <span>Hint</span>
          <span id="hintBadge" class="px-1.5 py-0.2 rounded bg-amber-500/20 text-amber-400 text-xs font-bold">3</span>
        </button>

        <button id="btnMagnet" title="Pull 3 neighboring cards together into a connected group" class="flex-1 flex items-center justify-center gap-1.5 py-1 px-2.5 rounded-xl bg-[#21262d] hover:bg-[#30363d] active:scale-95 transition text-[#e6edf3] border border-[#30363d] text-xs font-semibold cursor-pointer whitespace-nowrap">
          <span>🧲</span>
          <span>Magnet</span>
          <span id="magnetBadge" class="px-1.5 py-0.2 rounded bg-purple-500/20 text-purple-400 text-xs font-bold">3</span>
        </button>

        <button id="btnPreview" title="Toggle reference image overlay" class="flex-1 flex items-center justify-center gap-1.5 py-1 px-2.5 rounded-xl bg-[#21262d] hover:bg-[#30363d] active:scale-95 transition text-[#e6edf3] border border-[#30363d] text-xs font-semibold cursor-pointer whitespace-nowrap">
          <span>👁️</span>
          <span>Preview</span>
        </button>

        <button id="btnSolitaireDeal" title="Toggle face-down mystery cards that flip when neighbors connect" class="flex-1 flex items-center justify-center gap-1.5 py-1 px-2.5 rounded-xl bg-[#21262d] hover:bg-[#30363d] active:scale-95 transition text-[#e6edf3] border border-[#30363d] text-xs font-semibold cursor-pointer whitespace-nowrap">
          <span>🂠</span>
          <span>Mystery Cards</span>
        </button>

        <button id="btnReset" class="flex-1 flex items-center justify-center gap-1.5 py-1 px-2.5 rounded-xl bg-[#21262d] hover:bg-[#30363d] active:scale-95 transition text-[#e6edf3] border border-[#30363d] text-xs font-semibold cursor-pointer whitespace-nowrap">
          <span>🔄</span>
          <span>Reset</span>
        </button>
      </div>
    </header>

    <!-- 2. MAIN WORKSPACE: SOLITAIRE BOARD (Left) + COLLAPSIBLE LIVE LEADERBOARD PANEL (Right) -->
    <div class="flex-1 flex flex-row min-h-0 overflow-hidden bg-[#0d1117]">
      <main id="boardWorkspace" class="flex-1 relative flex items-center justify-center pt-3 pb-12 px-3 sm:px-5 overflow-hidden min-w-0 min-h-0 bg-[#0d1117]">
        <!-- Target Puzzle Board Frame (Vertical Rectangular Card Aspect Ratio) -->
        <div id="puzzleBoard" class="relative rounded-xl border-2 border-[#30363d] bg-[#090d12] shadow-xl overflow-visible">
          <!-- Target Drop Footprint Highlight Layer -->
          <div id="dropHighlightLayer" class="absolute inset-0 pointer-events-none z-30"></div>

          <!-- Rectangular Solitaire Cards Layer -->
          <div id="boardCardsLayer" class="absolute inset-0"></div>

          <!-- Full-Board Reference Ghost Image Overlay -->
          <img id="ghostImage" alt="Full Puzzle Reference" class="w-full h-full rounded-xl opacity-0 transition-opacity duration-200 pointer-events-none absolute inset-0 z-25" />

          <!-- Particle & Seam Shimmer Effects Layer -->
          <div id="effectsLayer" class="absolute inset-0 pointer-events-none z-40 overflow-visible"></div>

          <!-- Notification / Validation Toast Banner at Bottom of Board with Y+ Offset (+12px) -->
          <div id="toastBanner" class="hidden absolute left-1/2 -translate-x-1/2 top-[calc(100%+12px)] z-40 w-[96%] max-w-md px-3.5 py-2 rounded-xl border border-[#30363d] bg-[#161b22] text-[#e6edf3] shadow-xl text-xs font-semibold flex items-center justify-between gap-2">
            <span id="toastMessage"></span>
            <button id="toastClose" class="text-xs font-bold px-1.5 py-0.5 rounded bg-[#21262d] hover:bg-[#30363d] text-[#8b949e] hover:text-[#e6edf3] border border-[#30363d] cursor-pointer">✕</button>
          </div>
        </div>

        <!-- Completion Banner Overlay -->
        <div id="winOverlay" class="hidden absolute inset-0 bg-black/60 backdrop-blur-xs flex items-center justify-center z-50 p-4">
          <div class="bg-[#161b22] border border-[#30363d] rounded-2xl p-6 text-center shadow-xl max-w-xs w-full flex flex-col items-center gap-3">
            <div class="text-4xl">🎉</div>
            <h2 class="text-lg font-bold text-[#e6edf3]">Picture Complete!</h2>
            <p id="winSummaryText" class="text-xs text-[#8b949e]">All solitaire cards connected into a seamless picture! +25 Coins earned.</p>
            <div id="winRankBadge" class="px-3 py-1 rounded-lg bg-amber-500/20 border border-amber-500/40 text-amber-400 text-xs font-mono font-bold">
              🏆 League Rank Updated!
            </div>
            <div class="w-full flex gap-2">
              <button id="btnViewLbFromWin" class="flex-1 py-2 px-3 rounded-xl bg-[#21262d] hover:bg-[#30363d] border border-[#30363d] text-[#e6edf3] font-semibold text-xs active:scale-95 transition cursor-pointer">
                🏆 Leaderboard
              </button>
              <button id="btnPlayAgain" class="flex-1 py-2 px-3 rounded-xl bg-blue-600 hover:bg-blue-500 border border-blue-500 text-white font-semibold text-xs active:scale-95 transition cursor-pointer">
                Play Again
              </button>
            </div>
          </div>
        </div>
      </main>

      <!-- 3. RIGHT-SIDE LIVE OFFLINE LEADERBOARD PANEL (Expanded by Default, Toggled via Top Button Click) -->
      <aside id="leaderboardAside" class="w-[310px] border-l border-[#30363d] bg-[#161b22] flex flex-col shrink-0 z-10 select-none transition-all duration-200">
        <!-- Panel Header -->
        <div class="px-2.5 py-2 border-b border-[#30363d] flex items-center justify-between gap-1 bg-[#161b22] shrink-0">
          <div class="flex items-center gap-1.5">
            <span class="text-xs">🏆</span>
            <span class="text-xs font-bold text-[#e6edf3]">Offline Leaderboard</span>
          </div>
          <button id="btnCloseLeaderboard" title="Close Leaderboard Panel" class="px-2 py-0.5 rounded bg-[#21262d] hover:bg-[#30363d] text-[#8b949e] hover:text-[#e6edf3] border border-[#30363d] text-xs font-bold cursor-pointer transition">
            ✕
          </button>
        </div>

        <!-- Leaderboard Content Container -->
        <div class="flex-1 min-h-0 flex flex-col p-2.5 gap-2 overflow-hidden bg-[#161b22]">
          <!-- Mode Sub-Tabs -->
          <div class="shrink-0 flex items-center justify-between gap-1 bg-[#0d1117] p-1 rounded-xl border border-[#30363d]">
            <div class="flex items-center gap-1">
              <button id="lbModeGame" class="px-2 py-1 rounded-lg bg-blue-600 text-white text-xs font-bold cursor-pointer transition">
                🃏 Solitaire
              </button>
              <button id="lbModeUnified" class="px-2 py-1 rounded-lg bg-[#21262d] hover:bg-[#30363d] text-[#8b949e] hover:text-[#e6edf3] text-xs font-semibold cursor-pointer transition">
                🏆 Unified
              </button>
            </div>
            <div class="flex items-center gap-1 text-xs font-mono font-bold text-amber-400 px-1">
              <span>⏱️</span>
              <span id="lbCountdown">04d 23h</span>
            </div>
          </div>

          <!-- Player Rank & Score KPI Strip -->
          <div class="shrink-0 px-2.5 py-1.5 rounded-xl bg-[#0d1117] border border-[#30363d] flex items-center justify-between text-xs">
            <div class="flex items-center gap-1.5">
              <span class="text-[#8b949e] font-semibold">Rank:</span>
              <span id="lbPlayerRank" class="font-mono font-bold text-amber-400">#30/30</span>
              <span id="lbRankDelta" class="font-mono font-bold text-emerald-400"></span>
            </div>
            <div class="flex items-center gap-1.5">
              <span class="text-[#8b949e] font-semibold" id="lbScoreLabel">Score:</span>
              <span id="lbPlayerScore" class="font-mono font-bold text-[#e6edf3]">0 pts</span>
            </div>
          </div>

          <!-- Season Expired / Idempotent Reward Claim Banner -->
          <div id="lbRewardBanner" class="hidden shrink-0 px-2.5 py-1.5 rounded-xl bg-amber-500/15 border border-amber-500/40 flex items-center justify-between gap-1.5">
            <span id="lbRewardText" class="text-xs font-bold text-[#e6edf3] truncate">Season Complete!</span>
            <div class="flex items-center gap-1 shrink-0">
              <button id="lbBtnClaim" class="px-2 py-0.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-[#0d1117] text-xs font-bold cursor-pointer transition">
                🎁 Claim
              </button>
              <button id="lbBtnNextSeason" class="hidden px-2 py-0.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold cursor-pointer transition">
                🔄 Next
              </button>
            </div>
          </div>

          <!-- Pooled User-Centered Window Rows -->
          <div id="lbRowsContainer" class="flex-1 min-h-0 bg-[#0d1117] border border-[#30363d] rounded-xl overflow-y-auto divide-y divide-[#21262d]">
          </div>

          <!-- Live-Ops Simulation Footer (+4h, -6h Rollback Clamp, End Season) -->
          <div class="shrink-0 flex items-center justify-between gap-1 pt-0.5">
            <div class="flex items-center gap-1">
              <button id="lbBtnPlus4h" class="px-2 py-1 rounded-lg bg-[#21262d] hover:bg-[#30363d] border border-[#30363d] text-[#e6edf3] text-xs font-semibold cursor-pointer transition">
                ⏩ +4h
              </button>
              <button id="lbBtnMinus6h" class="px-2 py-1 rounded-lg bg-[#21262d] hover:bg-[#30363d] border border-rose-500/40 text-rose-400 text-xs font-semibold cursor-pointer transition">
                ⏪ -6h
              </button>
              <button id="lbBtnExpire" class="px-2 py-1 rounded-lg bg-[#21262d] hover:bg-[#30363d] border border-amber-500/40 text-amber-400 text-xs font-semibold cursor-pointer transition">
                🏁 End
              </button>
            </div>
            <span id="lbPhaseBadge" class="text-[11px] font-mono text-[#8b949e] truncate">Live Sync</span>
          </div>
        </div>
      </aside>
    </div>

    <!-- Floating Drag & Flight Animation Layer -->
    <div id="dragLayer" class="pointer-events-none fixed inset-0 z-50"></div>
  </div>

  <script>
    const MIN_PHOTO_SIZE = 300;
    const CARD_GAP = 1.5; // Minimal 1.5px gap between unmerged rectangular cards (0px when connected!)
    const BOARD_ASPECT = 0.80; // Width / Height ratio so every card is a vertical rectangle

    const state = {
      rows: 4,
      cols: 4,
      scene: 'sunset',
      lastValidScene: 'sunset',
      customImageElement: null,
      boardW: 400,
      boardH: 500,
      tileW: 100,
      tileH: 125,
      showPreview: false,
      mysteryMode: false,
      animatingPowerup: false,
      hintsLeft: 3,
      magnetsLeft: 3,
      coins: 150,
      fullBoardImageUrl: '',
      cards: [], // { id, row, col, boardRow, boardCol, groupId, faceDown, justJoinedGroup }
      dragging: null,
      nextGroupId: 1
    };

    const boardWorkspace = document.getElementById('boardWorkspace');
    const puzzleBoard = document.getElementById('puzzleBoard');
    const dropHighlightLayer = document.getElementById('dropHighlightLayer');
    const boardCardsLayer = document.getElementById('boardCardsLayer');
    const ghostImage = document.getElementById('ghostImage');
    const effectsLayer = document.getElementById('effectsLayer');
    const dragLayer = document.getElementById('dragLayer');
    const progressText = document.getElementById('progressText');
    const coinCount = document.getElementById('coinCount');
    const hintBadge = document.getElementById('hintBadge');
    const magnetBadge = document.getElementById('magnetBadge');
    const winOverlay = document.getElementById('winOverlay');
    const sceneSelect = document.getElementById('sceneSelect');
    const customPhotoOption = document.getElementById('customPhotoOption');
    const fileInput = document.getElementById('fileInput');
    const toastBanner = document.getElementById('toastBanner');
    const toastMessage = document.getElementById('toastMessage');

    let toastTimer = null;
    function showToast(msg, isError = false) {
      toastMessage.textContent = msg;
      toastBanner.classList.remove('hidden');
      toastBanner.style.borderColor = isError ? '#ef4444' : '#30363d';
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toastBanner.classList.add('hidden');
      }, 3600);
    }
    document.getElementById('toastClose').addEventListener('click', () => {
      toastBanner.classList.add('hidden');
    });

    // --- 1. VISUAL & CALM AUDIO EFFECTS ENGINE (Imported from Calm Jigsaw) ---
    let audioCtx = null;
    function playCalmChime(type = 'join') {
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;
          audioCtx = new AudioContextClass();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const now = audioCtx.currentTime;
        const pentatonic = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99];

        if (type === 'swap') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(329.63, now);
          osc.frequency.exponentialRampToValueAtTime(392.00, now + 0.14);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.17);
        } else if (type === 'join') {
          const connectedCount = countConnectedCards();
          const baseFreq = pentatonic[connectedCount % pentatonic.length];
          [baseFreq, baseFreq * 1.25].forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.055);
            gain.gain.setValueAtTime(0.13, now + idx * 0.055);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.055 + 0.34);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + idx * 0.055);
            osc.stop(now + idx * 0.055 + 0.36);
          });
        } else if (type === 'win') {
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.09);
            gain.gain.setValueAtTime(0.15, now + idx * 0.09);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.09 + 0.5);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + idx * 0.09);
            osc.stop(now + idx * 0.09 + 0.52);
          });
        }
      } catch (_) {}
    }

    function spawnRippleRing(cx, cy, diameter, color) {
      const ring = document.createElement('div');
      ring.className = 'effect-ring';
      ring.style.left = `${cx}px`;
      ring.style.top = `${cy}px`;
      ring.style.width = `${diameter}px`;
      ring.style.height = `${diameter}px`;
      ring.style.border = `2.5px solid ${color}`;
      ring.style.boxShadow = `0 0 12px ${color}`;
      effectsLayer.appendChild(ring);
      setTimeout(() => ring.remove(), 600);
    }

    function spawnSparkleBurst(cx, cy, colors, count = 12, spread = 42) {
      for (let i = 0; i < count; i++) {
        const dot = document.createElement('div');
        const size = 4 + Math.random() * 5;
        const color = colors[i % colors.length];
        dot.style.position = 'absolute';
        dot.style.left = `${cx}px`;
        dot.style.top = `${cy}px`;
        dot.style.width = `${size}px`;
        dot.style.height = `${size}px`;
        dot.style.borderRadius = i % 3 === 0 ? '2px' : '9999px';
        dot.style.background = color;
        dot.style.boxShadow = `0 0 8px ${color}`;
        dot.style.transform = 'translate(-50%, -50%) scale(1)';
        dot.style.opacity = '1';
        dot.style.transition =
          'transform 520ms cubic-bezier(0.16, 1, 0.3, 1), opacity 520ms ease-out';

        effectsLayer.appendChild(dot);

        const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.35;
        const dist = spread * (0.55 + Math.random() * 0.65);
        const dx = Math.cos(angle) * dist;
        const dy = Math.sin(angle) * dist;

        requestAnimationFrame(() => {
          dot.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0.15) rotate(${Math.round(Math.random() * 180)}deg)`;
          dot.style.opacity = '0';
        });

        setTimeout(() => dot.remove(), 550);
      }
    }

    function triggerSeamMergeEffects(mergedGroupIds, seamPoints) {
      const joinPalette = ['#fde047', '#38bdf8', '#34d399', '#ffffff'];
      state.cards.forEach(c => {
        if (mergedGroupIds.has(c.groupId)) {
          c.justJoinedGroup = true;
        }
      });

      seamPoints.forEach(({ x, y }) => {
        spawnRippleRing(x, y, Math.min(state.tileW, state.tileH) * 0.72, 'rgba(250, 204, 21, 0.9)');
        spawnSparkleBurst(x, y, joinPalette, 10, Math.min(state.tileW, state.tileH) * 0.55);
      });

      const isWin = checkWinCondition();
      playCalmChime(isWin ? 'win' : 'join');
    }

    // --- 2. RECTANGULAR BOARD SIZING & PROCEDURAL SCENE GENERATOR ---
    function computeViewportBoardDimensions() {
      const rect = boardWorkspace.getBoundingClientRect();
      const availW = Math.max(240, rect.width - 32);
      const availH = Math.max(280, rect.height - 56);

      // Fit largest vertical rectangular board (width = height * BOARD_ASPECT)
      let boardH = availH;
      let boardW = Math.floor(boardH * BOARD_ASPECT);
      if (boardW > availW) {
        boardW = availW;
        boardH = Math.floor(boardW / BOARD_ASPECT);
      }

      // Snap dimensions to clean multiples of cols/rows so 0px merged seams have zero subpixel gaps
      boardW = Math.floor(boardW / state.cols) * state.cols;
      boardH = Math.floor(boardH / state.rows) * state.rows;

      puzzleBoard.style.width = `${boardW}px`;
      puzzleBoard.style.height = `${boardH}px`;
      state.boardW = boardW;
      state.boardH = boardH;
      state.tileW = boardW / state.cols;
      state.tileH = boardH / state.rows;
    }

    function generateFullBoardImage(w, h, scene) {
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');

      if (scene === 'custom' && state.customImageElement) {
        // Center-crop custom image to fill the rectangular board
        const img = state.customImageElement;
        const imgAspect = img.naturalWidth / img.naturalHeight;
        const boardAspect = w / h;
        let sx = 0, sy = 0, sw = img.naturalWidth, sh = img.naturalHeight;
        if (imgAspect > boardAspect) {
          sw = img.naturalHeight * boardAspect;
          sx = (img.naturalWidth - sw) / 2;
        } else {
          sh = img.naturalWidth / boardAspect;
          sy = (img.naturalHeight - sh) / 2;
        }
        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
        return canvas.toDataURL();
      }

      if (scene === 'sunset') {
        const sky = ctx.createLinearGradient(0, 0, 0, h * 0.65);
        sky.addColorStop(0, '#3b1d5e');
        sky.addColorStop(0.45, '#b84a62');
        sky.addColorStop(1, '#f7b267');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, w, h);

        ctx.fillStyle = '#ffe599';
        ctx.beginPath();
        ctx.arc(w * 0.62, h * 0.34, Math.min(w, h) * 0.14, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#6d3b6e';
        ctx.beginPath();
        ctx.moveTo(0, h * 0.62);
        ctx.lineTo(w * 0.25, h * 0.38);
        ctx.lineTo(w * 0.52, h * 0.55);
        ctx.lineTo(w * 0.8, h * 0.34);
        ctx.lineTo(w, h * 0.52);
        ctx.lineTo(w, h * 0.65);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#43234f';
        ctx.beginPath();
        ctx.moveTo(0, h * 0.66);
        ctx.lineTo(w * 0.15, h * 0.52);
        ctx.lineTo(w * 0.44, h * 0.42);
        ctx.lineTo(w * 0.72, h * 0.58);
        ctx.lineTo(w * 0.92, h * 0.45);
        ctx.lineTo(w, h * 0.55);
        ctx.lineTo(w, h * 0.66);
        ctx.closePath();
        ctx.fill();

        const lake = ctx.createLinearGradient(0, h * 0.65, 0, h);
        lake.addColorStop(0, '#e07a5f');
        lake.addColorStop(0.5, '#813b65');
        lake.addColorStop(1, '#26143b');
        ctx.fillStyle = lake;
        ctx.fillRect(0, h * 0.65, w, h * 0.35);

        ctx.fillStyle = 'rgba(255, 229, 153, 0.48)';
        for (let i = 0; i < 7; i++) {
          const y = h * 0.69 + i * (h * 0.04);
          const barW = w * (0.24 - i * 0.025);
          ctx.fillRect(w * 0.62 - barW / 2, y, barW, 3.5);
        }
      } else if (scene === 'flamingo') {
        // Inspired by the Play Store Calm Jigsaw Solitaire flamingo sunset screenshot
        const sky = ctx.createLinearGradient(0, 0, 0, h * 0.54);
        sky.addColorStop(0, '#f9a875');
        sky.addColorStop(0.6, '#fbd1a2');
        sky.addColorStop(1, '#f79d65');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, w, h * 0.54);

        // Setting sun
        ctx.fillStyle = '#fff5c0';
        ctx.beginPath();
        ctx.arc(w * 0.28, h * 0.42, w * 0.11, 0, Math.PI * 2);
        ctx.fill();

        // Turquoise & sunset reflection water
        const water = ctx.createLinearGradient(0, h * 0.54, w, h);
        water.addColorStop(0, '#38a3a5');
        water.addColorStop(0.55, '#57cc99');
        water.addColorStop(1, '#f4a261');
        ctx.fillStyle = water;
        ctx.fillRect(0, h * 0.54, w, h * 0.46);

        // Water ripples
        ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
        for (let i = 0; i < 12; i++) {
          const ry = h * 0.57 + i * (h * 0.034);
          ctx.fillRect(w * (0.1 + (i % 3) * 0.18), ry, w * 0.32, 2.5);
        }

        // Flamingo legs
        ctx.strokeStyle = '#d62828';
        ctx.lineWidth = Math.max(5, w * 0.018);
        ctx.beginPath();
        ctx.moveTo(w * 0.56, h * 0.60);
        ctx.lineTo(w * 0.54, h * 0.88);
        ctx.moveTo(w * 0.63, h * 0.60);
        ctx.lineTo(w * 0.66, h * 0.85);
        ctx.stroke();

        // Flamingo body
        const bodyGrad = ctx.createLinearGradient(w * 0.35, h * 0.42, w * 0.75, h * 0.64);
        bodyGrad.addColorStop(0, '#ff758f');
        bodyGrad.addColorStop(0.5, '#ff4d6d');
        bodyGrad.addColorStop(1, '#c9184a');
        ctx.fillStyle = bodyGrad;
        ctx.beginPath();
        ctx.ellipse(w * 0.58, h * 0.53, w * 0.21, h * 0.10, -0.12, 0, Math.PI * 2);
        ctx.fill();

        // Flamingo S-curve neck
        ctx.strokeStyle = '#ff5d8f';
        ctx.lineWidth = Math.max(12, w * 0.045);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(w * 0.42, h * 0.52);
        ctx.bezierCurveTo(w * 0.24, h * 0.45, w * 0.50, h * 0.26, w * 0.34, h * 0.20);
        ctx.stroke();

        // Flamingo head & beak
        ctx.fillStyle = '#ff5d8f';
        ctx.beginPath();
        ctx.arc(w * 0.33, h * 0.20, w * 0.048, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#1f2937';
        ctx.beginPath();
        ctx.moveTo(w * 0.29, h * 0.20);
        ctx.lineTo(w * 0.21, h * 0.24);
        ctx.lineTo(w * 0.25, h * 0.28);
        ctx.lineTo(w * 0.31, h * 0.22);
        ctx.closePath();
        ctx.fill();
      } else if (scene === 'forest') {
        const sky = ctx.createLinearGradient(0, 0, 0, h);
        sky.addColorStop(0, '#a8dadc');
        sky.addColorStop(0.55, '#f1faee');
        sky.addColorStop(1, '#457b9d');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, w, h);

        ctx.fillStyle = '#fff3b0';
        ctx.beginPath();
        ctx.arc(w * 0.3, h * 0.22, Math.min(w, h) * 0.11, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#74a892';
        ctx.beginPath();
        ctx.arc(w * 0.25, h * 0.75, w * 0.48, Math.PI, 0);
        ctx.arc(w * 0.8, h * 0.75, w * 0.42, Math.PI, 0);
        ctx.fill();

        const drawPine = (x, baseY, treeH, color) => {
          ctx.fillStyle = color;
          for (let layer = 0; layer < 3; layer++) {
            ctx.beginPath();
            const topY = baseY - treeH + layer * (treeH * 0.22);
            const botY = baseY - layer * (treeH * 0.2);
            const spread = (treeH * 0.34) * (1 - layer * 0.22);
            ctx.moveTo(x, topY);
            ctx.lineTo(x - spread, botY);
            ctx.lineTo(x + spread, botY);
            ctx.closePath();
            ctx.fill();
          }
        };
        drawPine(w * 0.18, h * 0.82, h * 0.32, '#2d6a4f');
        drawPine(w * 0.34, h * 0.86, h * 0.26, '#1b4332');
        drawPine(w * 0.74, h * 0.84, h * 0.35, '#1b4332');
        drawPine(w * 0.88, h * 0.88, h * 0.24, '#2d6a4f');

        ctx.fillStyle = '#1d3557';
        ctx.fillRect(0, h * 0.82, w, h * 0.18);
      } else {
        const sky = ctx.createLinearGradient(0, 0, 0, h * 0.55);
        sky.addColorStop(0, '#48cae4');
        sky.addColorStop(1, '#caf0f8');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, w, h * 0.55);

        const sea = ctx.createLinearGradient(0, h * 0.55, 0, h);
        sea.addColorStop(0, '#0077b6');
        sea.addColorStop(0.65, '#00b4d8');
        sea.addColorStop(1, '#f4e285');
        ctx.fillStyle = sea;
        ctx.fillRect(0, h * 0.55, w, h * 0.45);

        ctx.fillStyle = '#52b788';
        ctx.beginPath();
        ctx.arc(w * 0.22, h * 0.56, w * 0.2, Math.PI, 0);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(w * 0.68, h * 0.40);
        ctx.lineTo(w * 0.68, h * 0.58);
        ctx.lineTo(w * 0.80, h * 0.58);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#bc4749';
        ctx.beginPath();
        ctx.moveTo(w * 0.60, h * 0.59);
        ctx.lineTo(w * 0.83, h * 0.59);
        ctx.lineTo(w * 0.78, h * 0.64);
        ctx.lineTo(w * 0.64, h * 0.64);
        ctx.closePath();
        ctx.fill();
      }

      return canvas.toDataURL();
    }

    // --- 3. CARD NEIGHBOR CONNECTION & SEAM FUSION LOGIC ---
    function getCardAtSlot(bRow, bCol) {
      return state.cards.find(c => c.boardRow === bRow && c.boardCol === bCol) || null;
    }

    /**
     * Checks all adjacent cards on the board. If two face-up cards sit next to each other
     * in their exact relative picture orientation:
     *   (A.boardRow - B.boardRow === A.row - B.row) && (A.boardCol - B.boardCol === A.col - B.col)
     * their groups automatically fuse into one seamless unit and any adjacent face-down mystery cards flip face-up!
     */
    function evaluateBoardMerges(silent = false) {
      let anyMerged = false;
      let loopMerged = true;
      const seamPoints = [];
      const mergedGroupIds = new Set();

      while (loopMerged) {
        loopMerged = false;
        for (let i = 0; i < state.cards.length; i++) {
          const a = state.cards[i];
          if (a.faceDown) continue;

          for (let j = i + 1; j < state.cards.length; j++) {
            const b = state.cards[j];
            if (b.faceDown || a.groupId === b.groupId) continue;

            const dTrueR = a.row - b.row;
            const dTrueC = a.col - b.col;
            if (Math.abs(dTrueR) + Math.abs(dTrueC) !== 1) continue;

            const dBoardR = a.boardRow - b.boardRow;
            const dBoardC = a.boardCol - b.boardCol;

            if (dBoardR === dTrueR && dBoardC === dTrueC) {
              const targetGroupId = Math.min(a.groupId, b.groupId);
              const oldGroupId = Math.max(a.groupId, b.groupId);

              state.cards.forEach(c => {
                if (c.groupId === oldGroupId) {
                  c.groupId = targetGroupId;
                }
              });

              mergedGroupIds.add(targetGroupId);

              // Record midpoint of the shared border seam for sparkle effect
              const seamX = ((a.boardCol + b.boardCol) / 2 + 0.5) * state.tileW;
              const seamY = ((a.boardRow + b.boardRow) / 2 + 0.5) * state.tileH;
              seamPoints.push({ x: seamX, y: seamY });

              loopMerged = true;
              anyMerged = true;
            }
          }
        }
      }

      // If a merge happened in Mystery Cards mode, flip any face-down cards orthographically adjacent to the newly merged group
      if (anyMerged && state.mysteryMode) {
        const newlyFlipped = [];
        state.cards.forEach(c => {
          if (!c.faceDown) return;
          const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
          for (const [dr, dc] of dirs) {
            const nb = getCardAtSlot(c.boardRow + dr, c.boardCol + dc);
            if (nb && !nb.faceDown && mergedGroupIds.has(nb.groupId)) {
              c.faceDown = false;
              newlyFlipped.push(c);
              break;
            }
          }
        });
        if (newlyFlipped.length > 0) {
          // Re-check if the newly flipped cards also match their neighbors
          evaluateBoardMerges(true);
        }
      }

      if (anyMerged && !silent) {
        triggerSeamMergeEffects(mergedGroupIds, seamPoints);
      }

      return anyMerged;
    }

    function countConnectedCards() {
      const counts = new Map();
      state.cards.forEach(c => {
        counts.set(c.groupId, (counts.get(c.groupId) || 0) + 1);
      });
      let connected = 0;
      counts.forEach(cnt => {
        if (cnt > 1) connected += cnt;
      });
      return connected;
    }

    function checkWinCondition() {
      if (state.cards.length === 0) return false;
      const firstGroup = state.cards[0].groupId;
      return state.cards.every(c => !c.faceDown && c.groupId === firstGroup);
    }

    // --- 4. INITIALIZE & SCRAMBLE SOLITAIRE BOARD ---
    function initPuzzle(preserveState = false) {
      computeViewportBoardDimensions();
      state.fullBoardImageUrl = generateFullBoardImage(state.boardW, state.boardH, state.scene);
      ghostImage.src = state.fullBoardImageUrl;

      const total = state.rows * state.cols;

      if (!preserveState || state.cards.length !== total) {
        state.cards = [];
        state.nextGroupId = 1;

        for (let r = 0; r < state.rows; r++) {
          for (let c = 0; c < state.cols; c++) {
            state.cards.push({
              id: `card-${r}-${c}`,
              row: r,
              col: c,
              boardRow: r,
              boardCol: c,
              groupId: state.nextGroupId++,
              faceDown: false,
              justJoinedGroup: false
            });
          }
        }

        // Scramble board slots so no two neighboring pieces start already connected
        scrambleSlotsWithoutInitialMatches();

        // If Mystery Cards mode is active, deal ~25% non-adjacent cards face-down
        if (state.mysteryMode) {
          applyMysteryFaceDownCards();
        }

        state.runSubmitted = false;
        state.runStartTimeMs = Date.now();
        winOverlay.classList.add('hidden');
      }

      renderAll();
    }

    function scrambleSlotsWithoutInitialMatches() {
      const slots = [];
      for (let r = 0; r < state.rows; r++) {
        for (let c = 0; c < state.cols; c++) {
          slots.push({ r, c });
        }
      }

      for (let attempt = 0; attempt < 40; attempt++) {
        slots.sort(() => Math.random() - 0.5);
        state.cards.forEach((card, idx) => {
          card.boardRow = slots[idx].r;
          card.boardCol = slots[idx].c;
          card.groupId = state.nextGroupId++;
        });

        // Verify zero accidental pre-merged neighbors on initial deal
        let hasPreMatch = false;
        for (let i = 0; i < state.cards.length; i++) {
          for (let j = i + 1; j < state.cards.length; j++) {
            const a = state.cards[i];
            const b = state.cards[j];
            if (Math.abs(a.row - b.row) + Math.abs(a.col - b.col) === 1) {
              if (a.boardRow - b.boardRow === a.row - b.row && a.boardCol - b.boardCol === a.col - b.col) {
                hasPreMatch = true;
                break;
              }
            }
          }
          if (hasPreMatch) break;
        }
        if (!hasPreMatch) break;
      }
    }

    function applyMysteryFaceDownCards() {
      const total = state.cards.length;
      const targetFaceDown = Math.max(2, Math.floor(total * 0.22));
      const indices = [...Array(total).keys()].sort(() => Math.random() - 0.5);
      for (let i = 0; i < total; i++) {
        state.cards[indices[i]].faceDown = i < targetFaceDown;
      }
    }

    // --- 5. CREATE RECTANGULAR CARD DOM ELEMENT WITH DYNAMIC SEAM REMOVAL ---
    function getSameGroupConnections(card) {
      if (card.faceDown) {
        return { top: false, right: false, bottom: false, left: false };
      }
      const isSameGroupAt = (bRow, bCol) => {
        const nb = getCardAtSlot(bRow, bCol);
        return Boolean(nb && !nb.faceDown && nb.groupId === card.groupId);
      };
      return {
        top: isSameGroupAt(card.boardRow - 1, card.boardCol),
        right: isSameGroupAt(card.boardRow, card.boardCol + 1),
        bottom: isSameGroupAt(card.boardRow + 1, card.boardCol),
        left: isSameGroupAt(card.boardRow, card.boardCol - 1)
      };
    }

    function createCardElement(card, conn) {
      const topInset = conn.top ? 0 : CARD_GAP;
      const bottomInset = conn.bottom ? 0 : CARD_GAP;
      const leftInset = conn.left ? 0 : CARD_GAP;
      const rightInset = conn.right ? 0 : CARD_GAP;

      const x = card.boardCol * state.tileW + leftInset;
      const y = card.boardRow * state.tileH + topInset;
      const w = state.tileW - leftInset - rightInset;
      const h = state.tileH - topInset - bottomInset;

      const el = document.createElement('div');
      el.dataset.cardId = card.id;
      el.style.position = 'absolute';
      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      el.style.width = `${w}px`;
      el.style.height = `${h}px`;

      // Outer corners are rounded (6px); connected inner corners become 0px for a seamless picture block
      const rTL = !conn.top && !conn.left ? '6px' : '0px';
      const rTR = !conn.top && !conn.right ? '6px' : '0px';
      const rBR = !conn.bottom && !conn.right ? '6px' : '0px';
      const rBL = !conn.bottom && !conn.left ? '6px' : '0px';
      el.style.borderRadius = `${rTL} ${rTR} ${rBR} ${rBL}`;
      el.style.overflow = 'hidden';

      if (card.faceDown) {
        // Royal Purple Solitaire Card Back (Inspired by Play Store screenshots)
        el.style.background = 'linear-gradient(145deg, #6d28d9 0%, #4c1d95 100%)';
        el.style.border = '1.5px solid rgba(216, 180, 254, 0.55)';
        el.className = 'flex flex-col items-center justify-center cursor-grab select-none shadow-sm';
        const innerBadge = document.createElement('div');
        innerBadge.className = 'px-2 py-1 rounded-md border border-purple-300/30 bg-purple-950/40 text-purple-200 text-xs font-bold tracking-wide flex flex-col items-center';
        innerBadge.innerHTML = '<span>🃏</span>';
        el.appendChild(innerBadge);
      } else {
        // Exact UV slice of the full board image so connected neighbors have zero seam offset
        el.style.backgroundImage = `url(${state.fullBoardImageUrl})`;
        el.style.backgroundSize = `${state.boardW}px ${state.boardH}px`;
        el.style.backgroundPosition = `${-(card.col * state.tileW + leftInset)}px ${-(card.row * state.tileH + topInset)}px`;
        el.style.backgroundRepeat = 'no-repeat';

        // Crisp card borders on unconnected edges; 0px on connected inner edges
        const bStyle = '1px solid rgba(255, 255, 255, 0.38)';
        el.style.borderTop = conn.top ? 'none' : bStyle;
        el.style.borderRight = conn.right ? 'none' : bStyle;
        el.style.borderBottom = conn.bottom ? 'none' : bStyle;
        el.style.borderLeft = conn.left ? 'none' : bStyle;
        el.className = 'cursor-grab select-none';
      }

      return el;
    }

    // --- 6. RENDER SOLITAIRE BOARD ---
    function renderAll() {
      const totalCount = state.rows * state.cols;
      const connectedCount = countConnectedCards();

      progressText.textContent = `${connectedCount}/${totalCount} Connected`;
      coinCount.textContent = state.coins;
      hintBadge.textContent = state.hintsLeft;
      magnetBadge.textContent = state.magnetsLeft;

      const draggingIds = new Set(
        state.dragging ? state.dragging.cluster.map(item => item.card.id) : []
      );

      boardCardsLayer.innerHTML = '';
      dropHighlightLayer.innerHTML = '';

      state.cards.forEach(card => {
        const conn = getSameGroupConnections(card);
        const el = createCardElement(card, conn);

        if (draggingIds.has(card.id)) {
          // Leave subtle dimmed slot placeholder where the dragged card/group came from
          el.style.opacity = '0.22';
          el.style.filter = 'grayscale(40%)';
          el.classList.remove('cursor-grab');
          el.classList.add('pointer-events-none');
        } else {
          if (card.justJoinedGroup) {
            el.classList.add('group-join-anim');
            card.justJoinedGroup = false;
          }
          el.addEventListener('pointerdown', e => startDrag(e, card));
        }

        boardCardsLayer.appendChild(el);
      });

      if (checkWinCondition()) {
        if (!state.runSubmitted) {
          state.runSubmitted = true;
          const elapsedMs = Math.max(3000, Date.now() - (state.runStartTimeMs || Date.now()));
          const mysteryBonus = state.mysteryMode ? 120 : 0;
          const runPts = totalCount * 18 + state.hintsLeft * 25 + mysteryBonus;
          if (window.OfflineLeaderboard) {
            window.OfflineLeaderboard.setWallet(state.coins);
            const resSol = window.OfflineLeaderboard.submitRun('jigsaw_solitaire', runPts);
            const resUni = window.OfflineLeaderboard.submitRun('unified_league', runPts);
            const sumEl = document.getElementById('winSummaryText');
            const badgeEl = document.getElementById('winRankBadge');
            if (sumEl) {
              sumEl.textContent = `Connected ${totalCount} cards in ${(elapsedMs / 1000).toFixed(1)}s! +25🪙 & +${runPts} Tourney Pts.`;
            }
            if (badgeEl && resSol) {
              badgeEl.textContent = resSol.rankDelta > 0
                ? `🚀 Rank #${resSol.newRank} (▲+${resSol.rankDelta} Overtake!)`
                : `🏆 Solitaire Rank #${resSol.newRank} • Unified #${resUni ? resUni.newRank : '-'}`;
            }
          }
        }
        setTimeout(() => {
          winOverlay.classList.remove('hidden');
        }, 280);
      }
    }

    // --- 7. GROUP DRAG & MULTI-TILE DISPLACEMENT SWAP LOGIC ---
    function startDrag(e, leadCard) {
      if (state.animatingPowerup || checkWinCondition()) return;
      e.preventDefault();

      // If face-down, only drags as a single card; if face-up, drags its entire connected groupId block
      const groupMembers = leadCard.faceDown
        ? [leadCard]
        : state.cards.filter(c => !c.faceDown && c.groupId === leadCard.groupId);

      dragLayer.innerHTML = '';
      const boardRect = puzzleBoard.getBoundingClientRect();

      const leadCenterX = boardRect.left + (leadCard.boardCol + 0.5) * state.tileW;
      const leadCenterY = boardRect.top + (leadCard.boardRow + 0.5) * state.tileH;
      const grabOffsetX = e.clientX - leadCenterX;
      const grabOffsetY = e.clientY - leadCenterY;

      const cluster = groupMembers.map(member => {
        const relRow = member.boardRow - leadCard.boardRow;
        const relCol = member.boardCol - leadCard.boardCol;
        const conn = getSameGroupConnections(member);
        const dragEl = createCardElement(member, conn);

        dragEl.style.position = 'fixed';
        dragEl.classList.remove('cursor-grab');
        dragEl.classList.add('pointer-events-none', 'card-shadow-dragging');
        dragLayer.appendChild(dragEl);

        return { card: member, relRow, relCol, conn, dragEl };
      });

      state.dragging = {
        leadCard,
        grabOffsetX,
        grabOffsetY,
        cluster,
        targetLeadRow: leadCard.boardRow,
        targetLeadCol: leadCard.boardCol,
        validTarget: true
      };

      updateDragPositions(e.clientX, e.clientY);
      renderAll();
      renderDropFootprint();
    }

    function updateDragPositions(clientX, clientY) {
      if (!state.dragging) return;
      const { grabOffsetX, grabOffsetY, cluster } = state.dragging;

      const leadCenterX = clientX - grabOffsetX;
      const leadCenterY = clientY - grabOffsetY;

      cluster.forEach(({ relRow, relCol, conn, dragEl }) => {
        const topInset = conn.top ? 0 : CARD_GAP;
        const leftInset = conn.left ? 0 : CARD_GAP;
        const cellLeft = leadCenterX - state.tileW / 2 + relCol * state.tileW + leftInset;
        const cellTop = leadCenterY - state.tileH / 2 + relRow * state.tileH + topInset;
        dragEl.style.left = `${cellLeft}px`;
        dragEl.style.top = `${cellTop}px`;
      });

      // Compute nearest target grid slot on the board
      const boardRect = puzzleBoard.getBoundingClientRect();
      const rawCol = Math.round((leadCenterX - boardRect.left - state.tileW / 2) / state.tileW);
      const rawRow = Math.round((leadCenterY - boardRect.top - state.tileH / 2) / state.tileH);

      // Clamp target lead row/col so the entire connected group stays inside the board boundaries
      const minRelRow = Math.min(...cluster.map(c => c.relRow));
      const maxRelRow = Math.max(...cluster.map(c => c.relRow));
      const minRelCol = Math.min(...cluster.map(c => c.relCol));
      const maxRelCol = Math.max(...cluster.map(c => c.relCol));

      const clampedRow = Math.max(-minRelRow, Math.min(state.rows - 1 - maxRelRow, rawRow));
      const clampedCol = Math.max(-minRelCol, Math.min(state.cols - 1 - maxRelCol, rawCol));

      state.dragging.targetLeadRow = clampedRow;
      state.dragging.targetLeadCol = clampedCol;
    }

    function renderDropFootprint() {
      dropHighlightLayer.innerHTML = '';
      if (!state.dragging) return;

      const { cluster, targetLeadRow, targetLeadCol } = state.dragging;
      cluster.forEach(({ relRow, relCol }) => {
        const r = targetLeadRow + relRow;
        const c = targetLeadCol + relCol;
        const cell = document.createElement('div');
        cell.style.position = 'absolute';
        cell.style.left = `${c * state.tileW + 1}px`;
        cell.style.top = `${r * state.tileH + 1}px`;
        cell.style.width = `${state.tileW - 2}px`;
        cell.style.height = `${state.tileH - 2}px`;
        cell.className = 'rounded-md border-2 border-sky-400/80 bg-sky-400/15 pointer-events-none';
        dropHighlightLayer.appendChild(cell);
      });
    }

    window.addEventListener('pointermove', e => {
      if (!state.dragging) return;
      updateDragPositions(e.clientX, e.clientY);
      renderDropFootprint();
    });

    /**
     * Executes a multi-tile displacement swap when a single card or connected group is dropped
     * onto target slots `(targetLeadRow + relRow, targetLeadCol + relCol)`.
     */
    window.addEventListener('pointerup', () => {
      if (!state.dragging) return;
      const { leadCard, cluster, targetLeadRow, targetLeadCol } = state.dragging;
      state.dragging = null;
      dragLayer.innerHTML = '';
      dropHighlightLayer.innerHTML = '';

      const dRow = targetLeadRow - leadCard.boardRow;
      const dCol = targetLeadCol - leadCard.boardCol;

      if (dRow === 0 && dCol === 0) {
        renderAll();
        return;
      }

      const movingSet = new Set(cluster.map(c => c.card));
      const sourceSlots = cluster.map(c => ({ r: c.card.boardRow, c: c.card.boardCol }));
      const targetSlots = cluster.map(c => ({
        r: c.card.boardRow + dRow,
        c: c.card.boardCol + dCol
      }));

      const targetKeySet = new Set(targetSlots.map(s => `${s.r},${s.c}`));
      const sourceKeySet = new Set(sourceSlots.map(s => `${s.r},${s.c}`));

      // Vacated slots are source slots that are not part of the new target footprint
      const vacatedSlots = sourceSlots.filter(s => !targetKeySet.has(`${s.r},${s.c}`));

      // Displaced cards are non-moving cards sitting inside the new target footprint
      const displacedCards = [];
      targetSlots.forEach(s => {
        if (!sourceKeySet.has(`${s.r},${s.c}`)) {
          const occupant = getCardAtSlot(s.r, s.c);
          if (occupant && !movingSet.has(occupant)) {
            displacedCards.push(occupant);
          }
        }
      });

      // If any displaced card belonged to a larger group that was partially overlapped, split its groupId so remaining pieces stay valid
      const affectedGroupIds = new Set(displacedCards.map(c => c.groupId));
      displacedCards.forEach(dc => {
        dc.groupId = state.nextGroupId++;
      });

      // Animate the displaced cards flying smoothly into the vacated source slots
      const flightMoves = displacedCards.map((card, idx) => ({
        card,
        fromRow: card.boardRow,
        fromCol: card.boardCol,
        toRow: vacatedSlots[idx].r,
        toCol: vacatedSlots[idx].c
      }));

      // Update board coordinates for moving cluster & displaced cards
      cluster.forEach(({ card }) => {
        card.boardRow += dRow;
        card.boardCol += dCol;
      });
      flightMoves.forEach(({ card, toRow, toCol }) => {
        card.boardRow = toRow;
        card.boardCol = toCol;
      });

      // Re-validate any groups that had a member displaced
      affectedGroupIds.forEach(gid => revalidateGroupContiguity(gid));

      animateCardSwaps(flightMoves, () => {
        const merged = evaluateBoardMerges(false);
        if (!merged) {
          playCalmChime('swap');
        }
        if (checkWinCondition()) {
          state.coins += 25;
        }
        renderAll();
      });
    });

    function revalidateGroupContiguity(groupId) {
      const members = state.cards.filter(c => c.groupId === groupId);
      if (members.length <= 1) return;
      // Reset each member to a fresh groupId and let evaluateBoardMerges(true) re-link contiguous neighbors
      members.forEach(m => {
        m.groupId = state.nextGroupId++;
      });
      evaluateBoardMerges(true);
    }

    // --- 8. SMOOTH CARD SWAP FLIGHT ANIMATOR (Adapted from Calm Jigsaw) ---
    function animateCardSwaps(moves, onComplete) {
      if (moves.length === 0) {
        onComplete();
        return;
      }
      state.animatingPowerup = true;
      renderAll();

      const boardRect = puzzleBoard.getBoundingClientRect();
      dragLayer.innerHTML = '';

      const flightNodes = moves.map(({ card, fromRow, fromCol, toRow, toCol }) => {
        const targetDom = boardCardsLayer.querySelector(`[data-card-id="${card.id}"]`);
        if (targetDom) targetDom.style.visibility = 'hidden';

        const tempCard = { ...card, boardRow: fromRow, boardCol: fromCol };
        const flyEl = createCardElement(tempCard, { top: false, right: false, bottom: false, left: false });

        const startLeft = boardRect.left + fromCol * state.tileW + CARD_GAP;
        const startTop = boardRect.top + fromRow * state.tileH + CARD_GAP;
        const endLeft = boardRect.left + toCol * state.tileW + CARD_GAP;
        const endTop = boardRect.top + toRow * state.tileH + CARD_GAP;

        flyEl.style.position = 'fixed';
        flyEl.style.left = `${startLeft}px`;
        flyEl.style.top = `${startTop}px`;
        flyEl.style.transition =
          'left 320ms cubic-bezier(0.22, 1, 0.36, 1), top 320ms cubic-bezier(0.22, 1, 0.36, 1)';
        flyEl.classList.add('pointer-events-none', 'card-shadow-dragging');
        dragLayer.appendChild(flyEl);

        return { flyEl, targetDom, endLeft, endTop };
      });

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          flightNodes.forEach(({ flyEl, endLeft, endTop }) => {
            flyEl.style.left = `${endLeft}px`;
            flyEl.style.top = `${endTop}px`;
          });
        });
      });

      setTimeout(() => {
        dragLayer.innerHTML = '';
        flightNodes.forEach(({ targetDom }) => {
          if (targetDom) targetDom.style.visibility = 'visible';
        });
        state.animatingPowerup = false;
        onComplete();
      }, 340);
    }

    // --- 9. POWERUPS: HINT, MAGNET, SHUFFLE, PREVIEW, MYSTERY CARDS ---
    document.getElementById('btnHint').addEventListener('click', () => {
      if (state.animatingPowerup || checkWinCondition()) return;
      if (state.hintsLeft <= 0) {
        showToast('No Hints remaining!', true);
        return;
      }

      // Find any pair of cards that are true orthogonal neighbors but not yet in the same group
      const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
      let chosenMove = null;

      const shuffledCards = [...state.cards].sort(() => Math.random() - 0.5);
      for (const anchor of shuffledCards) {
        for (const [dr, dc] of dirs) {
          const targetBoardR = anchor.boardRow + dr;
          const targetBoardC = anchor.boardCol + dc;
          if (targetBoardR < 0 || targetBoardR >= state.rows || targetBoardC < 0 || targetBoardC >= state.cols) continue;

          const trueNeighbor = state.cards.find(
            c => c.row === anchor.row + dr && c.col === anchor.col + dc
          );
          if (!trueNeighbor || trueNeighbor.groupId === anchor.groupId) continue;

          // Prefer moving a single unmerged card next to `anchor`
          const neighborGroupSize = state.cards.filter(c => c.groupId === trueNeighbor.groupId).length;
          const occupantAtTarget = getCardAtSlot(targetBoardR, targetBoardC);
          if (!occupantAtTarget) continue;
          const occupantGroupSize = state.cards.filter(c => c.groupId === occupantAtTarget.groupId).length;

          if (neighborGroupSize === 1 && occupantGroupSize === 1) {
            chosenMove = { anchor, mover: trueNeighbor, occupant: occupantAtTarget, targetBoardR, targetBoardC };
            break;
          }
        }
        if (chosenMove) break;
      }

      // Fallback: place any misplaced card into its true home slot `(card.row, card.col)`
      if (!chosenMove) {
        const misplaced = state.cards.find(c => c.boardRow !== c.row || c.boardCol !== c.col);
        if (misplaced) {
          const occupant = getCardAtSlot(misplaced.row, misplaced.col);
          if (occupant) {
            chosenMove = {
              anchor: misplaced,
              mover: misplaced,
              occupant,
              targetBoardR: misplaced.row,
              targetBoardC: misplaced.col
            };
          }
        }
      }

      if (!chosenMove) return;

      state.hintsLeft--;
      hintBadge.textContent = state.hintsLeft;

      const { anchor, mover, occupant, targetBoardR, targetBoardC } = chosenMove;
      anchor.faceDown = false;
      mover.faceDown = false;

      const oldMoverR = mover.boardRow;
      const oldMoverC = mover.boardCol;

      mover.boardRow = targetBoardR;
      mover.boardCol = targetBoardC;
      occupant.boardRow = oldMoverR;
      occupant.boardCol = oldMoverC;

      showToast('💡 Swapping matching neighbor cards together...');

      animateCardSwaps(
        [
          { card: mover, fromRow: oldMoverR, fromCol: oldMoverC, toRow: targetBoardR, toCol: targetBoardC },
          { card: occupant, fromRow: targetBoardR, fromCol: targetBoardC, toRow: oldMoverR, toCol: oldMoverC }
        ],
        () => {
          evaluateBoardMerges(false);
          if (checkWinCondition()) state.coins += 25;
          renderAll();
        }
      );
    });

    document.getElementById('btnMagnet').addEventListener('click', () => {
      if (state.animatingPowerup || checkWinCondition()) return;
      if (state.magnetsLeft <= 0) {
        showToast('No Magnet powerups remaining!', true);
        return;
      }

      // Find a seed card and up to 2 of its true orthogonal neighbors that can be placed into its true slots
      const misplaced = state.cards.filter(c => c.boardRow !== c.row || c.boardCol !== c.col || c.faceDown);
      if (misplaced.length === 0) return;

      const seed = misplaced[Math.floor(Math.random() * misplaced.length)];
      const dirs = [[0, 0], [-1, 0], [1, 0], [0, -1], [0, 1]];
      const trio = [];
      for (const [dr, dc] of dirs) {
        const cand = state.cards.find(c => c.row === seed.row + dr && c.col === seed.col + dc);
        if (cand && trio.length < 3) {
          trio.push(cand);
        }
      }

      state.magnetsLeft--;
      magnetBadge.textContent = state.magnetsLeft;

      const moves = [];
      trio.forEach(card => {
        card.faceDown = false;
        if (card.boardRow === card.row && card.boardCol === card.col) return;

        const occupant = getCardAtSlot(card.row, card.col);
        if (!occupant || occupant === card) return;

        const fromR = card.boardRow;
        const fromC = card.boardCol;
        const toR = card.row;
        const toC = card.col;

        card.boardRow = toR;
        card.boardCol = toC;
        occupant.boardRow = fromR;
        occupant.boardCol = fromC;
        occupant.groupId = state.nextGroupId++;

        moves.push(
          { card, fromRow: fromR, fromCol: fromC, toRow: toR, toCol: toC },
          { card: occupant, fromRow: toR, fromCol: toC, toRow: fromR, toCol: fromC }
        );
      });

      showToast(`🧲 Magnetizing ${trio.length} neighboring cards into place...`);

      animateCardSwaps(moves.slice(0, 6), () => {
        evaluateBoardMerges(false);
        if (checkWinCondition()) state.coins += 25;
        renderAll();
      });
    });

    document.getElementById('btnShuffle').addEventListener('click', () => {
      if (state.animatingPowerup || checkWinCondition()) return;

      // Only shuffle single unmerged cards so the player never loses connected groups
      const groupSizes = new Map();
      state.cards.forEach(c => groupSizes.set(c.groupId, (groupSizes.get(c.groupId) || 0) + 1));

      const singleCards = state.cards.filter(c => groupSizes.get(c.groupId) === 1);
      if (singleCards.length < 2) {
        showToast('All remaining cards are already in connected groups!');
        return;
      }

      const slots = singleCards.map(c => ({ r: c.boardRow, c: c.boardCol }));
      slots.sort(() => Math.random() - 0.5);

      const moves = [];
      singleCards.forEach((card, idx) => {
        const fromRow = card.boardRow;
        const fromCol = card.boardCol;
        const toRow = slots[idx].r;
        const toCol = slots[idx].c;
        card.boardRow = toRow;
        card.boardCol = toCol;
        if (fromRow !== toRow || fromCol !== toCol) {
          moves.push({ card, fromRow, fromCol, toRow, toCol });
        }
      });

      showToast('🔀 Shuffled unconnected cards on the board!');
      animateCardSwaps(moves, () => {
        evaluateBoardMerges(false);
        renderAll();
      });
    });
