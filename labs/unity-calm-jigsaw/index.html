<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Calm Jigsaw | Unity WebGL WASM</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      * {
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #0d1117;
        color: #e6edf3;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      #app-container {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        background-color: #0d1117;
        position: relative;
      }
      #canvas-stage {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
        background: #0d1117;
      }
      #unity-canvas {
        background: #161b22;
        box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        border: 1px solid #30363d;
        border-radius: 8px;
        display: block;
      }
      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        background: rgba(13, 17, 23, 0.95);
        padding: 24px 32px;
        border-radius: 16px;
        border: 1px solid #30363d;
        box-shadow: 0 16px 40px rgba(0,0,0,0.8);
        z-index: 50;
      }
      #unity-loading-title {
        margin-top: 10px;
        font-size: 13px;
        font-weight: 600;
        color: #58a6ff;
        font-family: monospace;
      }
      #unity-logo {
        width: 120px;
        height: 48px;
        background: url('TemplateData/unity-logo-dark.png') no-repeat center;
        background-size: contain;
      }
      #unity-progress-bar-empty {
        width: 200px;
        height: 10px;
        margin-top: 14px;
        background: #21262d;
        border-radius: 9999px;
        overflow: hidden;
        border: 1px solid #30363d;
      }
      #unity-progress-bar-full {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #38bdf8, #10b981);
        border-radius: 9999px;
        transition: width 0.15s ease-out;
      }
      #unity-warning {
        position: absolute;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        display: none;
        max-width: 90%;
        padding: 10px 18px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 600;
      }
      #app-footer {
        height: 40px;
        min-height: 40px;
        background: #161b22;
        border-top: 1px solid #30363d;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 14px;
        font-size: 11px;
        color: #8b949e;
        z-index: 20;
      }
      .badge-live {
        background: rgba(16, 185, 129, 0.15);
        color: #34d399;
        border: 1px solid rgba(16, 185, 129, 0.3);
        padding: 2px 7px;
        border-radius: 9999px;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 10.5px;
      }
      .badge-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background-color: #10b981;
        box-shadow: 0 0 6px #10b981;
      }
      #btn-fs {
        cursor: pointer;
        padding: 4px 10px;
        border-radius: 6px;
        background: #21262d;
        border: 1px solid #30363d;
        color: #c9d1d9;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-weight: 600;
        font-size: 11px;
        transition: all 0.15s;
      }
      #btn-fs:hover {
        background: #30363d;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="app-container">
      <div id="canvas-stage">
        <canvas id="unity-canvas" width="1280" height="800" tabindex="-1"></canvas>
        <div id="unity-loading-bar">
          <div id="unity-logo"></div>
          <div id="unity-loading-title">Loading Calm Jigsaw WASM...</div>
          <div id="unity-progress-bar-empty">
            <div id="unity-progress-bar-full"></div>
          </div>
        </div>
        <div id="unity-warning"></div>
      </div>

      <div id="app-footer">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="font-weight: 700; color: #f0f6fc;">🧩 Calm Jigsaw</span>
          <span class="badge-live"><span class="badge-dot"></span> Unity 6 WebGL</span>
          <span style="color: #6e7681;">•</span>
          <span style="color: #8b949e;">Interactive Jigsaw, Bezier Tabs, Group Merging, Hint & Magnet</span>
        </div>
        <div style="display: flex; align-items: center; gap: 10px;">
          <span style="font-family: monospace; color: #7ee787;">Unity 6000.3.14f1 WASM</span>
          <button id="btn-fs" type="button" title="Toggle Fullscreen">
            <span>⛶</span> <span>Fullscreen</span>
          </button>
        </div>
      </div>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");
      var stage = document.querySelector("#canvas-stage");

      canvas.addEventListener("contextmenu", function(e) {
        e.preventDefault();
        return false;
      });

      function fitCanvas() {
        if (!stage || !canvas) return;
        var sw = stage.clientWidth;
        var sh = stage.clientHeight;
        if (sw <= 0 || sh <= 0) return;

        canvas.style.width = sw + "px";
        canvas.style.height = sh + "px";
      }

      window.addEventListener("resize", fitCanvas);
      fitCanvas();

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        if (!warningBanner) return;
        warningBanner.textContent = msg;
        warningBanner.style.display = "block";
        if (type == 'error') {
          warningBanner.style.background = "#f85149";
          warningBanner.style.color = "#ffffff";
        } else {
          warningBanner.style.background = "#d29922";
          warningBanner.style.color = "#ffffff";
          setTimeout(function() {
            warningBanner.style.display = "none";
          }, 5000);
        }
      }

      var buildUrl = "Build";
      var cacheBust = "?v=20261011_bridge2";
      var loaderUrl = buildUrl + "/unity-calm-jigsaw.loader.js" + cacheBust;
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/unity-calm-jigsaw.data" + cacheBust,
        frameworkUrl: buildUrl + "/unity-calm-jigsaw.framework.js" + cacheBust,
        codeUrl: buildUrl + "/unity-calm-jigsaw.wasm" + cacheBust,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "ArpitJaiswal",
        productName: "Calm Jigsaw",
        productVersion: "1.1.0",
        showBanner: unityShowBanner,
      };

      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fsBtn = document.querySelector("#btn-fs");

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          fitCanvas();

          fsBtn.onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          alert("Error loading Unity WebGL player: " + message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
