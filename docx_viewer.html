    /* docx-preview styling overrides for authentic Word appearance */
    .docx-wrapper {

      align-items: center !important;
      gap: 24px !important;

      color: #000000 !important;
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.4), 0 4px 12px rgba(0, 0, 0, 0.25) !important;
      border-radius: 4px !important;
      margin-bottom: 24px !important;
      transition: transform 0.15s ease-out;
      overflow: hidden !important;
    }

    /* Print styles */
    @media print {
      body { background: white !important; }
      #viewer-toolbar { display: none !important; }
      .docx-wrapper { padding: 0 !important; gap: 0 !important; }
      .docx-wrapper > section.docx { box-shadow: none !important; margin: 0 !important; }

    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }

    function base64ToArrayBuffer(b64) {
      const binaryString = window.atob(b64);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return bytes.buffer;
    }

    function downloadWordDoc(e) {
      if (window.location.protocol.startsWith('http')) {
        return;
      }
      e.preventDefault();
      try {
        const buffer = base64ToArrayBuffer(docxB64);
        const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'Arpit_Jaiswal_Game_Dev_Resume.docx';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 2000);
      } catch (err) {
        window.location.href = DOC_PATH;
      }
    }
    let currentZoom = 1.0;
    const docxContainer = document.getElementById('docx-container');
    const loadingContainer = document.getElementById('loading-container');
    const errorContainer = document.getElementById('error-container');
    const zoomLabel = document.getElementById('zoom-label');
    const docMeta = document.getElementById('doc-meta');
    const reloadIcon = document.getElementById('reload-icon');

    // Load and render Word DOCX
    async function loadDocument() {
      loadingContainer.classList.remove('hidden');
      docxContainer.classList.add('hidden');
      errorContainer.classList.add('hidden');
      if (reloadIcon) reloadIcon.classList.add('animate-spin');

      try {
        let arrayBuffer;
        if (window.location.protocol === 'file:') {
          arrayBuffer = base64ToArrayBuffer(docxB64);
        } else {
          try {
            const cacheBusterUrl = `${DOC_PATH}?t=${Date.now()}`;
            const response = await fetch(cacheBusterUrl);
            if (!response.ok) throw new Error(`HTTP status: ${response.status}`);
            arrayBuffer = await response.arrayBuffer();
          } catch (netErr) {
            console.warn('Network fetch failed, using embedded Base64 backup:', netErr);
            arrayBuffer = base64ToArrayBuffer(docxB64);
          }
        }
        const fileSizeKb = (arrayBuffer.byteLength / 1024).toFixed(1);
        docMeta.textContent = `Size: ${fileSizeKb} KB • Updated: ${new Date().toLocaleTimeString()}`;

        // Clear previous content
        docxContainer.innerHTML = '';

        // Render using docx-preview
        await docx.renderAsync(arrayBuffer, docxContainer, null, {
          className: 'docx',
          inWrapper: true,
          ignoreWidth: false,
          ignoreHeight: false,
          ignoreFonts: false,
          breakPages: true,
          ignoreLastRenderedPageBreak: false,
          experimental: true,
          trimXml: true,
          debug: false
        });

        // Ensure half-line spacing between contact details row and Executive profile row
        const paragraphs = docxContainer.querySelectorAll('p');
        for (const p of paragraphs) {
          if (p.textContent.includes('EXECUTIVE PROFILE')) {
            p.style.marginTop = '10pt';
            break;
          }
        }

        loadingContainer.classList.add('hidden');
        docxContainer.classList.remove('hidden');
        applyZoom();

      } catch (err) {
        console.error('DOCX Render error:', err);
        loadingContainer.classList.add('hidden');
        errorContainer.classList.remove('hidden');
        document.getElementById('error-message').textContent = err.message || 'Error parsing OpenXML document.';
      } finally {
        if (reloadIcon) reloadIcon.classList.remove('animate-spin');
      }
    }

    // Zoom Management
    function setZoom(val) {
      currentZoom = Math.min(Math.max(val, 0.4), 2.5);
      applyZoom();
    }

    function applyZoom() {
      zoomLabel.textContent = `${Math.round(currentZoom * 100)}%`;
      docxContainer.style.transform = `scale(${currentZoom})`;
    }

    document.getElementById('btn-zoom-in').addEventListener('click', () => setZoom(currentZoom + 0.1));
    document.getElementById('btn-zoom-out').addEventListener('click', () => setZoom(currentZoom - 0.1));
    document.getElementById('btn-zoom-reset').addEventListener('click', () => setZoom(1.0));
    document.getElementById('btn-reload').addEventListener('click', () => loadDocument());

    document.getElementById('btn-fit-width').addEventListener('click', () => {
      const firstSection = docxContainer.querySelector('section.docx');
      if (firstSection) {
        const availableWidth = window.innerWidth - 64;
        const docWidth = firstSection.offsetWidth || 816; // 8.5" at 96 DPI
        if (availableWidth > 0 && docWidth > 0) {
          setZoom(availableWidth / docWidth);
        }
      }
    });

    // Initial render
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      loadDocument();
    });
  </script>
